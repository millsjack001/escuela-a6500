function findPart(id){ for(const k in PARTS){ const p = PARTS[k].find(x => x.id === id); if(p) return p; } return {n:id}; }

function mountCamera(el){
  let view = "back", sel = null;
  el.innerHTML = `
  <div class="stack">
   <div class="cam-tabs" role="group" aria-label="Vista">
    <button type="button" data-v="back" aria-pressed="true">Atrás</button>
    <button type="button" data-v="top" aria-pressed="false">Arriba</button>
    <button type="button" data-v="lens" aria-pressed="false">Objetivo</button>
   </div>
   <div class="cam-stage" data-stage></div>
   <div class="card cam-info" data-info aria-live="polite"></div>
   <div class="chips" data-chips aria-label="Partes"></div>
   <p class="muted" style="font-size:14px">Esquema simplificado, no a escala. La posición exacta de cada botón puede variar ligeramente.</p>
  </div>`;
  const stage = el.querySelector("[data-stage]"), info = el.querySelector("[data-info]"), chips = el.querySelector("[data-chips]");
  function pick(id){
    sel = id;
    stage.querySelectorAll(".hs").forEach(g => g.classList.toggle("on", g.dataset.id === id));
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === id));
    const p = findPart(id);
    info.innerHTML = `<div class="stack" style="gap:8px"><h3>${esc(p.n)} <span class="en">${esc(p.en)}</span></h3><p>${esc(p.d)}</p><p class="muted"><b>Consejo:</b> ${esc(p.tip)}</p></div>`;
  }
  function draw(){
    el.querySelectorAll(".cam-tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
    stage.innerHTML = cameraSVG(view);
    chips.innerHTML = PARTS[view].map(p => `<button type="button" class="chip" data-id="${p.id}" aria-pressed="false">${esc(p.n)}</button>`).join("");
    pick(PARTS[view][0].id);
  }
  // Some buttons are drawn only ~20 points wide, so a tap on the drawing goes to the closest part
  // within 22 points. Big parts (screen, wheel) count as a little farther, so a tap just beside a
  // small button that lands on the screen's edge still picks the button.
  const nearest = (x, y) => {
    let best = null, bs = Infinity;
    stage.querySelectorAll(".hs").forEach(g => {
      const r = g.getBoundingClientRect();
      const d = Math.hypot(Math.max(r.left - x, 0, x - r.right), Math.max(r.top - y, 0, y - r.bottom));
      const score = d + Math.sqrt(r.width * r.height) * .15;
      if(d <= 22 && score < bs){ best = g; bs = score; }
    });
    return best;
  };
  el.addEventListener("click", e => {
    const v = e.target.closest(".cam-tabs button"); if(v){ view = v.dataset.v; draw(); return; }
    const h = e.target.closest(".chip") || (stage.contains(e.target) && e.detail ? nearest(e.clientX, e.clientY) : e.target.closest(".hs")); if(!h) return;
    pick(h.dataset.id);
    // A name tapped in the list below: bring the drawing and its explanation back into view.
    if(h.classList.contains("chip") && info.getBoundingClientRect().top < 70) stage.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  });
  el.addEventListener("keydown", e => { const h = e.target.closest(".hs"); if(h && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(h.dataset.id); } });
  draw();
}

/* ---------- white balance demo ---------- */
function mountWB(el){
  const LIGHTS = [["Sol",5500],["Sombra",7500],["Nublado",6500],["Bombilla",3000],["Fluorescente",4000]];
  const SETS = [["Auto",0],["Luz diurna",5500],["Sombra",7000],["Nublado",6000],["Incandescente",3200],["Fluorescente",4000]];
  let light = 3000, set = 5500;
  el.innerHTML = `
  <div class="stack" style="gap:12px">
   <div class="wb-frame">
    <svg viewBox="0 0 320 180" aria-hidden="true">
     <rect width="320" height="180" fill="#E9E4DA"/>
     <rect x="0" y="118" width="320" height="62" fill="#B98E62"/>
     <rect x="0" y="118" width="320" height="4" fill="#9E7650"/>
     <rect x="200" y="22" width="90" height="70" fill="#C9D9E6" stroke="#FFFFFF" stroke-width="5"/>
     <path d="M245 22v70M200 57h90" stroke="#FFFFFF" stroke-width="3"/>
     <path d="M120 78h46l-5 52a6 6 0 0 1-6 5h-24a6 6 0 0 1-6-5z" fill="#FBFBF9" stroke="#D9D9D4"/>
     <path d="M166 90c14 0 14 26 0 26" fill="none" stroke="#FBFBF9" stroke-width="6"/>
     <ellipse cx="143" cy="80" rx="23" ry="4" fill="#5A3A22"/>
     <rect x="40" y="96" width="44" height="34" rx="4" fill="#5E8C5A"/>
     <circle cx="52" cy="90" r="12" fill="#6FA368"/><circle cx="70" cy="86" r="14" fill="#7AB273"/>
     <text x="143" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A4632">taza blanca</text>
    </svg>
    <div class="wb-cast" data-cast></div>
   </div>
   <div><div class="eyebrow" style="margin-bottom:6px">Luz real de la escena</div><div class="chips" data-l>${LIGHTS.map(([n,k]) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${k===light}">${n} · ${k} K</button>`).join("")}</div></div>
   <div><div class="eyebrow" style="margin-bottom:6px">Ajuste en la cámara</div><div class="chips" data-s>${SETS.map(([n,k]) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${k===set}">${n}${k?` · ${k} K`:""}</button>`).join("")}</div></div>
   <p data-msg class="card" style="padding:12px 14px"></p>
  </div>`;
  const cast = el.querySelector("[data-cast]"), msg = el.querySelector("[data-msg]");
  function render(){
    // AWB tracks the light but leaves warm tungsten slightly warm, as the camera's default "Standard" AWB does
    const eff = set === 0 ? (light < 3600 ? light * 1.12 : light) : set;
    const c = Math.log2(eff / light);
    const a = Math.min(.55, Math.abs(c) * 1.1);
    cast.style.background = c > 0 ? "#FF8A2A" : "#3B7BFF";
    cast.style.opacity = a < .04 ? 0 : a;
    let t;
    if(a < .06) t = "Colores naturales: la taza se ve blanca.";
    else if(c > 0) t = `Sale <b>anaranjada</b>: le dijiste a la cámara que la luz era más fría (más azul) de lo que es, y la cámara añadió calidez de más.`;
    else t = `Sale <b>azulada</b>: le dijiste a la cámara que la luz era más cálida (más naranja) de lo que es, y la cámara la enfrió de más.`;
    if(set === 0 && light < 3600) t += " En Auto, la cámara deja un toque cálido con luz de bombilla para que se sienta el ambiente.";
    msg.innerHTML = t;
    el.querySelectorAll("[data-l] .chip").forEach(b => b.setAttribute("aria-pressed", +b.dataset.k === light));
    el.querySelectorAll("[data-s] .chip").forEach(b => b.setAttribute("aria-pressed", +b.dataset.k === set));
  }
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    if(b.closest("[data-l]")) light = +b.dataset.k; else set = +b.dataset.k;
    render();
  });
  render();
}


/* ---------- intent planner ---------- */
function mountPlanner(el){
  const Q = [
   ["subj","¿Qué fotografías?",[["persona","Una persona"],["grupo","Un grupo"],["paisaje","Paisaje o lugar"],["objeto","Objeto o comida"]]],
   ["move","¿Se mueve?",[["no","Está quieto"],["poco","Algo (camina, gesticula)"],["rapido","Rápido (corre, salta)"]]],
   ["want","¿Qué quieres conseguir?",[["blur","Fondo borroso"],["sharp","Todo nítido"],["freeze","Congelar el movimiento"],["trail","Mostrar el movimiento"]]],
   ["light","¿Cuánta luz hay?",[["sol","Sol"],["sombra","Sombra o nublado"],["interior","Interior"],["noche","Noche"]]]
  ];
  const st = {subj:"persona", move:"no", want:"blur", light:"sombra"};
  el.innerHTML = `<div class="card stack" style="gap:14px">${Q.map(([k,t,o]) => `<div><div class="eyebrow" style="margin-bottom:6px">${t}</div><div class="chips" data-q="${k}">${o.map(([v,n]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="false">${n}</button>`).join("")}</div></div>`).join("")}<div data-out aria-live="polite"></div></div>`;
  function plan(){
    const {subj, move, want, light} = st, dark = light === "interior" || light === "noche";
    const fast = {no:"1/125", poco:"1/250", rapido:"1/1000"}[move];
    const why = [], warn = [];
    let mode, N = "La elige la cámara", t = "La elige la cámara", iso = "AUTO", zoom = "El que encuadre mejor";
    if(want === "trail"){
      mode = "S"; iso = "100 (el más bajo)";
      if(move === "no"){ t = "1/8 a 1 segundo"; why.push("Una velocidad lenta convierte lo que se mueve en el encuadre (agua, gente, coches, nubes) en estelas; lo quieto queda nítido."); }
      else { t = "1/30, siguiendo al sujeto"; why.push("Barrido: si sigues al sujeto con la cámara mientras disparas, él queda nítido y el fondo sale en rayas."); }
      if(light === "sol") warn.push("Con sol puede sobrar luz y el número F parpadear. Busca sombra o espera a que baje el sol.");
    } else if(want === "freeze"){
      mode = "S"; t = move === "no" ? "1/250" : fast;
      why.push(`A ${t} el movimiento queda congelado. La cámara elige la apertura y el ISO sube si falta luz.`);
      if(move === "no") warn.push("Si nada se mueve no hace falta congelar. Quizá te interesa más elegir el fondo (modo A).");
    } else if(move === "rapido"){
      mode = "M con ISO AUTO"; t = fast;
      N = want === "blur" ? "La más baja (F5.6 a 50 mm)" : "F8";
      if(want === "blur") zoom = "50 mm";
      why.push("Mandan a la vez el movimiento y lo nítido: fijas tú la velocidad y la apertura, y la cámara ajusta el ISO.");
    } else {
      mode = "A";
      if(want === "blur"){ N = "La más baja (F5.6 a 50 mm)"; zoom = "50 mm"; why.push("Apertura abierta, zoom largo y poca distancia al sujeto: así el fondo se desenfoca al máximo con este objetivo. Aleja al sujeto del fondo."); }
      else { N = subj === "paisaje" ? "F8 a F11" : "F8"; zoom = subj === "paisaje" ? "16 mm" : (subj === "grupo" ? "16–24 mm" : zoom); why.push("Con F8 la zona nítida es amplia y el objetivo da su mejor detalle."); }
      if(move === "poco") warn.push("Vigila que la velocidad no baje de 1/250. Si baja, sube el ISO o pasa a M con ISO AUTO.");
    }
    if(want === "blur" && subj === "grupo") warn.push("Con fondo borroso, quien esté a otra distancia saldrá desenfocado. Ponlos en una línea o usa F8.");
    if(want === "blur" && subj === "paisaje") warn.push("En un paisaje casi todo está lejos: el fondo apenas se desenfocará. Busca algo cercano que destacar.");
    if(dark && iso === "AUTO") why.push("Hay poca luz: el ISO AUTO subirá hasta 6400. Mejor algo de grano que una foto movida.");
    if(light === "noche" && move === "no" && (subj === "paisaje" || subj === "objeto")){ iso = "100–400"; why.push("De noche, con un sujeto quieto, apoya la cámara: puedes usar velocidades lentas con ISO bajo y la máxima calidad."); }
    const focus = move === "no" ? "AF-S" : "AF-C";
    const area = subj === "persona" ? (move === "rapido" ? "Zona o Lock-on AF + Eye AF" : "Eye AF (botón central)") : subj === "grupo" ? "Punto flexible en una cara de la fila central" : subj === "paisaje" ? "Punto flexible a un tercio de la escena" : (move === "rapido" ? "Zona o Lock-on AF" : "Punto flexible pequeño en lo importante");
    const drive = move === "rapido" ? "Continuo Hi" : subj === "grupo" ? "Autodisparador continuo (3 fotos)" : (want === "trail" && move === "no") || (light === "noche" && move === "no") ? "Autodisparador 2 s, cámara apoyada" : "Disparo único";
    if(light === "sol" && (subj === "persona" || subj === "grupo")) warn.push("Sol directo en la cara: busca sombra abierta, o pon el sol detrás y usa flash de relleno.");
    if(light === "noche" && (subj === "persona" || subj === "grupo")) warn.push("Para iluminar caras de noche: flash con sincronización lenta, o acércalas a una fuente de luz.");
    if(light === "interior") why.push("Antes de subir el ISO, acerca el sujeto a una ventana o lámpara: la luz manda.");
    return {mode, N, t, iso, zoom, focus, area, drive, why, warn};
  }
  function render(){
    el.querySelectorAll("[data-q]").forEach(g => g.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === st[g.dataset.q])));
    const r = plan();
    el.querySelector("[data-out]").innerHTML = `<div class="stack" style="gap:10px">

  }
  el.addEventListener("click", e => { const c = e.target.closest(".chip"); if(!c) return; st[c.closest("[data-q]").dataset.q] = c.dataset.v; render(); });

const AP = [3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22];
const SS = [1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,.3,.4,.5,.6,.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30];
const ISOS = [100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000,40000,51200];
const SCENES = [
 {id:"sol", wk:5500, n:"Sol", ev:15, sky:["#5FA8E0","#CFE8F7"], g:"#6E9F4E", hill:"#4F7F3E", tree:"#3E6B33", night:false},

];
const SIM = {mode:"A", scene:"sombra", f:50, N:5.6, t:1/125, iso:400, isoAuto:true, ev:0,
  // camera MENU settings the photo reacts to (indexes into their option lists below)
  minss:2, wb:0, style:0, ss:0, grid:3, mv:{}};
const EVS = Array.from({length: 19}, (_, i) => (i - 9) / 3);
const FLS = [16,18,20,22,24,28,30,35,40,45,50];
const fmtEV = v => (v > 0.01 ? "+" : v < -0.01 ? "−" : "±") + Math.abs(v).toFixed(1);
const nearestIdx = (arr, v) => { let bi = 0, bd = Infinity; arr.forEach((x,i) => { const d = Math.abs(Math.log2(x) - Math.log2(v)); if(d < bd){ bd = d; bi = i; } }); return bi; };
const snap = (arr, v) => arr[nearestIdx(arr, v)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function minAp(f){ const tbl = [[16,3.5],[18,4],[24,4.5],[30,5],[35,5.6],[50,5.6]]; for(let i=1;i<tbl.length;i++){ if(f <= tbl[i][0]){ const [f0,a0] = tbl[i-1], [f1,a1] = tbl[i]; const v = a0 + (a1-a0)*(f-f0)/(f1-f0); return AP.find(a => a >= v - 0.05) || 5.6; } } return 5.6; }
const fmtT = t => t >= .3 ? t + '"' : "1/" + Math.round(1/t);
const fmtN = N => "F" + N;

function solve(st){
  // Exposure compensation shifts what the camera aims for (in M only when ISO is AUTO, as on the camera).
  const comp = st.mode === "M" && !st.isoAuto ? 0 : (st.ev || 0);
  const sc = SCENES.find(s => s.id === st.scene), EV = sc.ev - comp, mA = minAp(st.f);
  let N = Math.max(st.N, mA), t = st.t, iso = st.isoAuto ? 100 : st.iso;
  const blink = {};
  const L = i => EV + Math.log2(i / 100);
  const handSS = 1 / (st.f * 1.5), minSS = handSS * MINSS[st.minss ?? 2][1];
  const isoFor = (N, t) => clamp(100 * Math.pow(2, Math.log2(N*N/t) - EV), 100, 6400);
  if(st.mode === "P" || st.mode === "A"){
    if(st.mode === "P"){ N = mA; let i = AP.indexOf(N); while(N*N/Math.pow(2, L(iso)) < 1/250 && N < 8){ N = AP[++i]; }
      if(st.shift) N = AP[clamp(AP.indexOf(N) + st.shift, AP.indexOf(mA), AP.length - 1)]; } // program shift with the control dial
    t = N*N / Math.pow(2, L(iso));
    if(st.isoAuto && t > minSS){ iso = snap(ISOS, isoFor(N, minSS)); t = N*N / Math.pow(2, L(iso)); }
    if(t < SS[0] || t > 30) blink.t = true;
    t = snap(SS, clamp(t, SS[0], 30));
  } else if(st.mode === "S"){
    let need = Math.sqrt(t * Math.pow(2, L(iso)));
    if(st.isoAuto && need < mA){ iso = snap(ISOS, isoFor(mA, t)); need = Math.sqrt(t * Math.pow(2, L(iso))); }
    if(need < mA - .05 || need > 22.5) blink.N = true;
    N = snap(AP, clamp(need, mA, 22));
  } else {
    if(st.isoAuto){ const raw = 100 * Math.pow(2, Math.log2(N*N/t) - EV); if(raw > 6400 || raw < 100) blink.iso = true; iso = snap(ISOS, clamp(raw, 100, 6400)); }
  }
  const delta = L(iso) - Math.log2(N*N/t) + comp;
  return {N, t, iso, delta, blink, sc, mA, minSS, handSS};
}

let noiseURL = null;
function getNoise(){
  if(noiseURL) return noiseURL;
  try{
    const c = document.createElement("canvas"); c.width = c.height = 160;
    const x = c.getContext("2d"), d = x.createImageData(160,160);
    for(let i=0;i<d.data.length;i+=4){ const v = Math.random()*255; d.data[i] = v + (Math.random()-.5)*60; d.data[i+1] = v; d.data[i+2] = v + (Math.random()-.5)*60; d.data[i+3] = 255; }
    x.putImageData(d,0,0); noiseURL = c.toDataURL();
  }catch(e){ noiseURL = ""; }
  return noiseURL;
}

  S: "S: gira el dial de control para cambiar la velocidad. La apertura la pone la cámara.",
  M: "M: el dial de control cambia la apertura y la rueda la velocidad. Mira el indicador MM.",
  other: "Este modo existe en tu cámara, pero el simulador lo trata como P. Para practicar usa AUTO, P, A, S o M."
};
function mountSim(el, opts){
  opts = opts || {};
  if(opts.mode) SIM.mode = opts.mode;
  if(!MODE_DIAL.includes(SIM.mode)) SIM.mode = "A";
  SIM.shift = 0; SIM.drive = SIM.drive || 0; SIM.disp = SIM.disp || 0; SIM.shots = SIM.shots || [];
  el.innerHTML = `
  <div class="stack sim">
   <div class="cam" data-cam>
    <div class="cam-top">
     <span class="cam-shoe" aria-hidden="true"></span>
     <div class="knob mode" data-knob="mode" role="slider" tabindex="0" aria-label="Dial de modos"><div class="mode-strip" data-modestrip>${MODE_DIAL.map((m, i) => `<span style="left:${i * 38}px">${m}</span>`).join("")}</div><i class="knob-idx" aria-hidden="true"></i></div>

    </div>
    <div class="cam-back">
     <div class="sim-frame" data-frame>
      ${sceneSVG()}
      <div class="sim-wb" data-wb></div>
      <div class="sim-ex dark" data-dark></div>
      <div class="sim-ex light" data-light></div>
      <div class="sim-noise" data-noise></div>
      <svg class="sim-grid" data-grid viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="sim-focus" data-focus aria-hidden="true"></div>
      <div class="sim-osd-top" data-osdtop></div>
      <div class="sim-osd" data-osd></div>
      <div class="sim-pop" data-pop hidden></div>
      <div class="cm" data-menu hidden></div>
      <div class="sim-black" data-black></div>
     </div>
     <div class="cam-right">
      <div class="cam-row"><button type="button" class="cbtn" data-k="menu">MENU</button><button type="button" class="cbtn round sm" data-k="aef" aria-label="Botón AF/MF · AEL">AEL</button></div>
      <button type="button" class="cbtn round" data-k="fn" aria-label="Botón Fn">Fn</button>
      <div class="wheel" data-wheel role="group" aria-label="Rueda de control: gírala o pulsa sus lados">
       <i class="wheel-ring" data-ring aria-hidden="true"></i>
       <button type="button" class="wk up" data-k="up" aria-label="Arriba: DISP">DISP</button>
       <button type="button" class="wk right" data-k="right" aria-label="Derecha: ISO">ISO</button>
       <button type="button" class="wk down" data-k="down" aria-label="Abajo: compensación de exposición">±</button>
       <button type="button" class="wk left" data-k="left" aria-label="Izquierda: modo de avance"><svg viewBox="0 0 20 16" aria-hidden="true"><rect x="1" y="5" width="11" height="9" rx="1"/><path d="M4 3h11v9M7 1h11v9"/></svg></button>
       <button type="button" class="wk ok" data-k="ok" aria-label="Botón central"></button>
      </div>
      <div class="cam-row"><button type="button" class="cbtn round sm" data-k="c3" aria-label="Botón C3 / borrar">C3</button><button type="button" class="cbtn round sm" data-k="play" aria-label="Botón de reproducción">▶</button></div>
     </div>
    </div>
    <div class="cam-lens">
     <span class="cam-lens-l">Zoom</span>
     <div class="knob knurl lens" data-knob="zoom" role="slider" tabindex="0" aria-label="Anillo de zoom del objetivo"></div>
     <b data-zoomv></b>
    </div>
   </div>
   <p class="sim-hint" data-hint aria-live="polite"></p>
   <div class="meter" data-meterwrap>
    <div class="meter-txt"><span>Más oscura</span><b data-metertxt></b><span>Más clara</span></div>
    <div class="meter-bar"><div class="meter-ticks">${[-3,-2,-1,0,1,2,3].map((v,i,a) => `<span class="big"><b>${v>0?"+"+v:v}</b></span>` + (i < a.length-1 ? "<span></span><span></span>" : "")).join("")}</div><div class="meter-mark" data-mark></div></div>
   </div>
   <section class="stack sim-light" style="gap:8px">
    <h3>¿Con qué luz haces la foto?</h3>
    <p class="muted" style="font-size:14px">Cambia la luz y mira cómo responde la cámara. No son ajustes recomendados: para eso está el <a href="#recetas">planificador de Recetas</a>.</p>
    <div class="chips chips-row" role="group" aria-label="Luz de la escena">${SCENES.map(s => `<button type="button" class="chip" data-scene="${s.id}" aria-pressed="false">${s.n}</button>`).join("")}</div>
    <p style="font-size:15px" data-scenetxt></p>
   </section>
   <ul class="verdict" data-verdict></ul>
   <details class="howto-d stack sim-help" style="gap:10px"><summary>Cómo se usa</summary>
    <ul>
     <li><b>Dial de modos</b> (arriba): desliza para elegir AUTO, P, A, S o M.</li>
     <li><b>Dial de control</b> (la rueda estriada de arriba): desliza o toca a un lado. En A cambia la apertura, en S la velocidad, en M la apertura.</li>
     <li><b>Rueda de control</b>: gírala con el dedo o pulsa sus lados. ISO a la derecha, ± abajo, avance a la izquierda, DISP arriba. El centro acepta.</li>
     <li><b>MENU</b> y <b>Fn</b> abren los menús. <b>▶</b> muestra tus fotos y <b>C3</b> las borra.</li>
     <li>El <b>disparador</b> hace la foto. Puedes tocar la pantalla para mover el enfoque, como en la cámara.</li>
    </ul>
    <p class="muted" style="font-size:14px">Simulación aproximada para entender la relación entre ajustes. El menú es una versión resumida del de la α6500, con las mismas pestañas y en el mismo orden.</p>
    <p class="muted" style="font-size:13px">Versión ${APP_BUILD}</p>
   </details>
  </div>`;
  const $ = s => el.querySelector(s);
  const frame = $("[data-frame]");
  $("[data-noise]").style.backgroundImage = getNoise() ? `url(${getNoise()})` : "none";
  const calmNow = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  // screen: live | menu | fn | iso | ev | drive | play | review
  const V = {screen: "live", fn: 0, fnSub: null, list: 0, play: 0, toast: "", toastT: 0, focus: [43.5, 52.5]};
  let r = null, hint = "";
  const simMode = () => ["P","A","S","M"].includes(SIM.mode) ? SIM.mode : "P";
  const state = () => { const {shots, mv, ...st} = SIM; return {...st, mode: simMode(), isoAuto: SIM.mode === "AUTO" ? true : SIM.isoAuto, shift: SIM.mode === "P" ? SIM.shift : 0}; };

  /* --- drawing is batched into one frame so dragging never queues up redraws --- */
  let queued = false;
  const schedule = () => { if(!queued){ queued = true; requestAnimationFrame(() => { queued = false; draw(); }); } };

  function photo(st, rr){
    const sc = rr.sc;
    $("[data-sky0]").setAttribute("stop-color", sc.sky[0]); $("[data-sky1]").setAttribute("stop-color", sc.sky[1]);
    $("[data-hill]").setAttribute("fill", sc.hill); $("[data-ground]").setAttribute("fill", sc.g);
    $("[data-trees]").setAttribute("fill", sc.tree);
    $("[data-sun]").setAttribute("fill", sc.night ? "#F4F1DE" : (sc.id === "atardecer" ? "#FFB04A" : "#FFF3B0"));
    $("[data-sun]").style.display = sc.indoor ? "none" : "";
    $("[data-stars]").style.display = sc.night ? "" : "none";
    $("[data-lamps]").style.display = sc.night ? "" : "none";
    el.querySelectorAll("[data-win]").forEach(w => w.setAttribute("fill", sc.night ? "#FFCF6E" : "#7E97A8"));
    $("[data-house]").style.display = sc.indoor ? "none" : "";
    const z = 1 + (st.f - 16) / 34 * 0.6;
    $("[data-world]").setAttribute("transform", `translate(132 118) scale(${z.toFixed(3)}) translate(-132 -118)`);
    const bg = 0.15 + 3.4 * Math.pow(st.f / 50, 1.6) * (3.5 / rr.N);
    $("[data-bgblur]").setAttribute("stdDeviation", bg.toFixed(2));
    const mv = Math.min(30, 420 * rr.t);
    $("[data-movblur]").setAttribute("stdDeviation", `${mv.toFixed(2)} 0`);
    const shakeRatio = rr.t / rr.handSS, steady = st.ss === 0, shakeEff = steady ? shakeRatio / 4 : shakeRatio;
    $("[data-shake]").setAttribute("stdDeviation", shakeEff > 1 ? Math.min(2.2, .4 * Math.log2(shakeEff * 4)).toFixed(2) : 0);
    // brightness as plain overlays (cheap for the phone to draw, unlike a CSS filter on the drawing)
    const b = clamp(Math.pow(2, rr.delta * .75), .05, 4.5);
    $("[data-dark]").style.opacity = b < 1 ? (1 - b).toFixed(3) : 0;
    $("[data-light]").style.opacity = b > 1 ? Math.min(.92, 1 - 1 / b).toFixed(3) : 0;
    const sty = STYLES[st.style] || STYLES[0], plain = sty[1] === 1 && sty[2] === 1;
    const sg = $("[data-styleg]");
    if(plain) sg.removeAttribute("filter");
    else { $("[data-sat]").setAttribute("values", sty[1]); el.querySelectorAll("[data-con]").forEach(f => { f.setAttribute("slope", sty[2]); f.setAttribute("intercept", ((1 - sty[2]) / 2).toFixed(3)); }); sg.setAttribute("filter", "url(#fStyle)"); }
    $("[data-noise]").style.opacity = (clamp((Math.log2(rr.iso / 100) - 3.3) / 6.5, 0, 1) * .5).toFixed(2);
    const wbK = WB[st.wb][1], cast = wbK ? Math.log2(wbK / sc.wk) : 0, bw = sty[1] === 0;
    const wbEl = $("[data-wb]");
    wbEl.style.background = cast > 0 ? "#FF8A1E" : "#2F7BFF";
    wbEl.style.opacity = bw ? 0 : Math.min(.8, Math.abs(cast) * 1.5).toFixed(2);
    return {bg, z, mv, shakeRatio, shakeEff, steady, cast, bw};
  }

  function osd(){
    const live = V.screen !== "play" && V.screen !== "menu";
    const st = state();
    $("[data-osdtop]").innerHTML = V.screen === "play"
      ? `<span>▶ ${V.play + 1}/${SIM.shots.length}</span><span>${esc(SCENES.find(s => s.id === SIM.shots[V.play].st.scene).n)}</span>`
      : `<span class="m">${SIM.mode === "P" && SIM.shift ? "P*" : esc(SIM.mode)}</span><span>${DRIVES[SIM.drive].startsWith("Auto") ? "⏱ " : DRIVES[SIM.drive].startsWith("Cont") ? "▤ " : ""}${999 - SIM.shots.length} · ▮▮▮</span>`;
    $("[data-osdtop]").hidden = !live && V.screen !== "play" || (SIM.disp === 1 && V.screen === "live");
    if(V.screen === "play"){
      const sh = SIM.shots[V.play];
      $("[data-osd]").innerHTML = `<span>${fmtT(sh.r.t)}</span><span>${fmtN(sh.r.N)}</span><span>${fmtEV(sh.st.ev)}</span><span>ISO ${sh.r.iso}</span><span>${sh.st.f} mm</span>`;
    } else {
      const bl = (k, s) => r.blink[k] ? `<span class="blink">${s}</span>` : `<span>${s}</span>`;
      const mm = (r.delta >= 0 ? "+" : "−") + Math.abs(Math.round(r.delta * 3) / 3).toFixed(1);
      $("[data-osd]").innerHTML = bl("t", fmtT(r.t)) + bl("N", fmtN(r.N)) + (st.mode === "M" && !st.isoAuto ? `<span>MM ${mm}</span>` : `<span>${fmtEV(SIM.ev)}</span>`) + bl("iso", "ISO " + (st.isoAuto ? "AUTO " : "") + r.iso)
        + (SIM.disp === 2 ? histo() : "");
    }
    $("[data-osd]").hidden = !(V.screen === "play" || (live && SIM.disp !== 1));
    $("[data-osd]").classList.toggle("with-h", SIM.disp === 2);
  }
  function histo(){
    // a rough histogram: the hill of tones moves right when the photo is brighter
    const c = clamp(50 + r.delta * 14, 6, 94), pts = [];
    for(let x = 0; x <= 100; x += 4){ const h = Math.exp(-Math.pow((x - c) / 18, 2)) * 0.8 + Math.exp(-Math.pow((x - c + 22) / 12, 2)) * 0.35; pts.push(`${x},${(30 - h * 28).toFixed(1)}`); }
    return `<svg class="histo" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,30 ${pts.join(" ")} 100,30"/></svg>`;
  }

  /* --- pop-ups the side buttons open on the screen (ISO, ±, drive, Fn) --- */
  function popHTML(){
    if(V.screen === "iso" || V.screen === "drive"){
      const o = V.screen === "iso" ? ["AUTO", ...ISOS.map(String)] : DRIVES, i = V.list;
      const first = clamp(i - 2, 0, Math.max(0, o.length - 5));
      return `<div class="pop-side"><b>${V.screen === "iso" ? "ISO" : "Modo de avance"}</b>${o.slice(first, first + 5).map((v, j) => `<span class="${first + j === i ? "on" : ""}">${esc(v)}</span>`).join("")}<small>Gira la rueda · centro: aceptar</small></div>`;
    }
    if(V.screen === "ev"){
      const v = EVS[V.list];
      return `<div class="pop-ev"><b>Compensación exposición</b><div class="ev-scale">${[-3,-2,-1,0,1,2,3].map(x => `<span>${x > 0 ? "+" + x : x}</span>`).join("")}<i style="left:${((v + 3) / 6 * 100).toFixed(1)}%"></i></div><span class="ev-v">${fmtEV(v)}</span><small>Gira la rueda · centro: aceptar</small></div>`;
    }
    if(V.screen === "fn"){
      const tiles = FN_ITEMS.map(([name, short], i) => { const loc = findItem(name); return `<span class="${i === V.fn ? "on" : ""}" data-fn="${i}"><small>${short}</small>${esc(shortVal(loc))}</span>`; }).join("");
      const cur = findItem(FN_ITEMS[V.fn][0]);
      if(V.fnSub !== null){
        const o = optsAt(cur);
        return `<div class="pop-side"><b>${esc(FN_ITEMS[V.fn][0])}</b>${o.slice(clamp(V.fnSub - 2, 0, Math.max(0, o.length - 5)), clamp(V.fnSub - 2, 0, Math.max(0, o.length - 5)) + 5).map((v, j) => `<span class="${clamp(V.fnSub - 2, 0, Math.max(0, o.length - 5)) + j === V.fnSub ? "on" : ""}">${esc(String(v))}</span>`).join("")}<small>Gira la rueda · centro: aceptar</small></div>`;
      }
      return `<div class="pop-fn"><div class="fn-title">${esc(FN_ITEMS[V.fn][0])}: <b>${esc(String(optsAt(cur)[valAt(cur)]))}</b></div><div class="fn-grid">${tiles}</div></div>`;
    }
    if(V.screen === "play" && !SIM.shots.length) return `<div class="pop-msg">No hay fotos. Pulsa el disparador para hacer una.</div>`;
    return "";
  }
  // Fn items reuse the MENU's values, so both places always agree
  function findItem(name){ for(let p = 0; p < MENU_PAGES.length; p++){ const j = MENU_PAGES[p].items.findIndex(it => it[0] === name); if(j >= 0) return {p, j, it: MENU_PAGES[p].items[j]}; } }
  const optsAt = loc => optsOf(loc.it);
  const valAt = loc => valFor(loc.p, loc.j);
  function setAt(loc, i){ const it = loc.it; if(it[3]) FX[it[3]].set(i); else SIM.mv[loc.p + "." + loc.j] = i; }
  function shortVal(loc){ const v = String(optsAt(loc)[valAt(loc)]); return v.replace("Disparo único", "Único").replace("Desactivado", "No").replace("Flash auto", "Auto").replace("Optimiz. gama D", "DRO").replace("Extra fino", "X.fino").replace("Punto flexible", "Punto").replace("Flash de relleno", "Relleno").replace("Flash desactivado", "No"); }

  /* --- the camera MENU (data in CAM_MENU) --- */
  const M = {page: 0, row: 0, sub: null, note: ""};
  const itemAt = () => MENU_PAGES[M.page].items[M.row];
  const FX = {
    ev: {opts: () => EVS.map(fmtEV), get: () => EVS.findIndex(v => Math.abs(v - SIM.ev) < .01), set: i => { SIM.ev = EVS[i]; }},
    iso: {opts: () => ["AUTO", ...ISOS.map(String)], get: () => SIM.isoAuto ? 0 : nearestIdx(ISOS, SIM.iso) + 1, set: i => { SIM.isoAuto = i === 0; if(i) SIM.iso = ISOS[i - 1]; }},
    drive: {opts: () => DRIVES, get: () => SIM.drive, set: i => { SIM.drive = i; }}
  };
  ["minss","wb","style","ss","grid"].forEach(k => FX[k] = {get: () => SIM[k], set: i => { SIM[k] = i; }});
  const optsOf = it => it[3] && FX[it[3]].opts ? FX[it[3]].opts() : it[1];
  function valFor(page, row){ const it = MENU_PAGES[page].items[row]; return it[3] ? FX[it[3]].get() : (SIM.mv[page + "." + row] ?? it[2]); }
  // drive mode lives on the wheel and in the menu: same value
  MENU_PAGES.forEach(p => p.items.forEach(it => { if(it[0] === "Modo de avance"){ it[3] = "drive"; } }));
  function menuHTML(){
    const pg = MENU_PAGES[M.page], tab = CAM_MENU[pg.ti];
    const note = M.note ? `<div class="cm-note" role="status">${M.note}</div>` : "";
    if(M.sub){
      const it = itemAt(), o = optsOf(it), cur = valFor(M.page, M.row);
      const first = clamp(M.sub.i - 3, 0, Math.max(0, o.length - 6));
      return `<div class="cm-title"><span style="color:${tab.c}">●</span> ${esc(it[0])}</div>
       <div class="cm-list">${o.slice(first, first + 6).map((v, j) => { const i = first + j; return `<button type="button" class="cm-row${i === M.sub.i ? " on" : ""}" data-opt="${i}"><span class="nm">${esc(String(v))}</span><span class="v">${i === cur ? "✓" : ""}</span></button>`; }).join("")}</div>${note}`;
    }
    const pagesOfTab = MENU_PAGES.map((p, i) => [p, i]).filter(([p]) => p.ti === pg.ti);
    return `<div class="cm-tabs">${CAM_MENU.map((t, ti) => `<button type="button" class="cm-tab${ti === pg.ti ? " on" : ""}" data-tab="${ti}" aria-label="${esc(t.n)}" style="color:${t.c}"><svg viewBox="0 0 24 24" aria-hidden="true">${MENU_ICON[t.ic](t.num)}</svg></button>`).join("")}</div>
     <div class="cm-sub"><span>${esc(tab.n)}</span><span class="cm-pages">${pagesOfTab.map(([p, i]) => `<button type="button" data-page="${i}"${i === M.page ? ' class="on"' : ""}>${p.pi + 1}</button>`).join("")}</span></div>
     <div class="cm-list">${pg.items.map((it, j) => { const o = optsOf(it); return `<button type="button" class="cm-row${j === M.row ? " on" : ""}" data-row="${j}"><span class="nm">${esc(it[0])}</span><span class="v">${o ? esc(String(o[valFor(M.page, j)])) : ""}</span></button>`; }).join("")}</div>${note}`;
  }
  function menuKey(k){
    M.note = "";
    const pg = MENU_PAGES[M.page];
    if(M.sub){
      const o = optsOf(itemAt());
      if(k === "up") M.sub.i = Math.max(0, M.sub.i - 1);
      else if(k === "down") M.sub.i = Math.min(o.length - 1, M.sub.i + 1);
      else if(k === "ok"){ const it = itemAt(); if(it[3]) FX[it[3]].set(M.sub.i); else SIM.mv[M.page + "." + M.row] = M.sub.i; M.sub = null; }
      else if(k === "menu" || k === "left") M.sub = null;
    } else {
      if(k === "up") M.row = (M.row - 1 + pg.items.length) % pg.items.length;
      else if(k === "down") M.row = (M.row + 1) % pg.items.length;
      else if(k === "left" || k === "right"){ M.page = (M.page + (k === "left" ? -1 : 1) + MENU_PAGES.length) % MENU_PAGES.length; M.row = Math.min(M.row, MENU_PAGES[M.page].items.length - 1); }
      else if(k === "ok"){ const o = optsOf(itemAt()); if(o) M.sub = {i: valFor(M.page, M.row)}; else M.note = "En la cámara esto abre otra pantalla. En el simulador no hace nada."; }
      else if(k === "menu") V.screen = "live";
    }
  }

  /* --- what each control does, by screen --- */
  function toast(t){ V.toast = t; clearTimeout(V.toastT); V.toastT = setTimeout(() => { V.toast = ""; schedule(); }, 2600); }
  function say(t){ hint = t; }
  function press(k){
    const s = V.screen;
    if(k === "shutter"){ if(s === "play" || s === "menu"){ V.screen = "live"; M.sub = null; } else shoot(); return schedule(); }
    if(k === "menu"){ if(s === "menu") menuKey("menu"); else if(s === "live"){ V.screen = "menu"; M.sub = null; say("MENU: gira la rueda o pulsa arriba y abajo para moverte, los lados cambian de página, el centro acepta y MENU vuelve atrás."); } else { V.screen = "live"; V.fnSub = null; } return schedule(); }
    if(s === "menu"){ menuKey(k === "c3" ? "" : k); return schedule(); }
    if(k === "play"){ V.screen = s === "play" ? "live" : "play"; V.play = Math.max(0, SIM.shots.length - 1); if(V.screen === "play") say("Reproducción: gira la rueda o pulsa los lados para pasar fotos. C3 borra. Vuelve con ▶ o el disparador."); return schedule(); }
    if(s === "play"){
      if(k === "left" || k === "right"){ if(SIM.shots.length) V.play = (V.play + (k === "left" ? -1 : 1) + SIM.shots.length) % SIM.shots.length; }
      else if(k === "c3" && SIM.shots.length){ SIM.shots.splice(V.play, 1); V.play = Math.max(0, Math.min(V.play, SIM.shots.length - 1)); toast("Foto borrada."); }

      else if(k === "up" || k === "down") listStep(k === "up" ? -1 : 1);
      else if(k === "fn") V.screen = "live";

    }

    if(k === "fn"){ V.screen = "fn"; V.fnSub = null; say("Fn: muévete con los lados de la rueda, gira el dial de control para cambiar el ajuste, o pulsa el centro para ver la lista."); }
    else if(k === "right"){ V.screen = "iso"; V.list = FX.iso.get(); say("ISO: gira la rueda y pulsa el centro para aceptar."); }
    else if(k === "down"){ V.screen = "ev"; V.list = FX.ev.get(); say("Compensación: gira la rueda. Más es una foto más clara. Centro para aceptar."); }
    else if(k === "left"){ V.screen = "drive"; V.list = SIM.drive; say("Modo de avance: disparo único, ráfaga o temporizador."); }
    else if(k === "up"){ SIM.disp = (SIM.disp + 1) % 3; toast(["Mostrar toda la info.", "Sin información.", "Histograma"][SIM.disp]); say("DISP cambia lo que ves en pantalla. El histograma muestra el brillo: si choca a la derecha, hay zonas quemadas."); }

    else if(k === "c1" || k === "c2" || k === "c3" || k === "aef") toast(k === "aef" ? "AF/MF · AEL: bloquea la exposición o cambia a enfoque manual." : `${k.toUpperCase()}: botón personalizable. Lo eliges en la lección «Hazla tuya».`);

  }
  function listStep(d){

  }
  function shoot(){
    const st = state(), rr = solve(st);

    const st = state();
    r = solve(st);

    if(SIM.mode === "S" || SIM.mode === "M") SIM.t = r.t;
    if(V.screen === "play" && SIM.shots.length){ const sh = SIM.shots[V.play]; photo(sh.st, sh.r); }

      if(g === 1 || g === 2) for(let i = 1; i < 6; i++) gl += L(i*50,0,i*50,200) + (i < 4 ? L(0,i*50,300,i*50) : "");

    const mn = $("[data-menu]"); mn.hidden = V.screen !== "menu"; if(V.screen === "menu") mn.innerHTML = menuHTML();

    // meter, hint, scenes, verdict

    $("[data-mark]").style.left = `${((mpos + 3) / 6 * 100).toFixed(1)}%`;
    $("[data-metertxt]").textContent = Math.abs(r.delta) < .2 ? "Exposición correcta" : (r.delta > 0 ? `+${r.delta.toFixed(1)} pasos` : `${r.delta.toFixed(1)} pasos`);
    $("[data-hint]").textContent = hint || MODE_HINT[["AUTO","P","A","S","M"].includes(SIM.mode) ? SIM.mode : "other"];

    $("[data-scenetxt]").textContent = SCENE_LIGHT[SIM.scene];
    const p = V.screen === "play" && SIM.shots.length ? photoFacts(SIM.shots[V.play].st, SIM.shots[V.play].r) : photoFacts(st, r);
    const v = [];
    v.push(["Brillo", Math.abs(p.r.delta) < .4 ? "Correcta." : p.r.delta > 0 ? (p.r.delta > 1.5 ? "Muy clara: zonas quemadas." : "Algo clara.") : (p.r.delta < -1.5 ? "Muy oscura." : "Algo oscura."), Math.abs(p.r.delta) >= .4]);
    v.push(["Fondo", p.bg * p.z > 4.5 ? "Muy desenfocado." : p.bg * p.z > 2 ? "Desenfocado." : p.bg * p.z > 1 ? "Algo suave." : "Nítido.", false]);
    v.push(["Ciclista", p.mv < 1.2 ? "Congelado." : p.mv < 5 ? "Ligeramente movido." : "Estela de movimiento.", false]);
    v.push(["Ruido", p.r.iso <= 800 ? "Imperceptible." : p.r.iso <= 3200 ? "Muy bajo." : p.r.iso <= 6400 ? "Algo de grano." : "Mucho grano.", p.r.iso > 6400]);
    v.push(["Pulso", p.shakeRatio <= 1 ? "Sin riesgo de foto movida." : p.shakeEff <= 1 ? "El SteadyShot te salva; sujétala firme." : p.steady ? "Foto movida: apoya la cámara o usa trípode." : "Foto movida: el SteadyShot está desactivado en el menú.", p.shakeEff > 1]);
    v.push(["Color", p.bw ? "Blanco y negro (estilo creativo B/N)." : Math.abs(p.cast) < .25 ? "Natural." : p.cast > 0 ? "Anaranjada: el balance de blancos no es el de esta luz." : "Azulada: el balance de blancos no es el de esta luz.", !p.bw && Math.abs(p.cast) >= .25]);
    if(Object.keys(p.r.blink).length) v.push(["Aviso", "Un valor parpadea: la cámara no llega a la exposición correcta con estos ajustes.", true]);
    const vh = v.map(([a,b,w]) => `<li class="${w?"w":""}"><b>${a}</b>${b}</li>`).join("");
    if(vh !== last.vh){ $("[data-verdict]").innerHTML = vh; last.vh = vh; }
  }
  // the same numbers photo() uses, without touching the drawing
  function photoFacts(st, rr){
    const z = 1 + (st.f - 16) / 34 * 0.6, bg = 0.15 + 3.4 * Math.pow(st.f / 50, 1.6) * (3.5 / rr.N), mv = Math.min(30, 420 * rr.t);

  // A finger anywhere on the camera body works the camera, like holding the real one, so it never

/* ---------- text size ---------- */
const ZOOMS = [1, 1.12, 1.25];
function applyZoom(){ document.documentElement.style.setProperty("--zoom", S.zoom); const b = document.getElementById("tsize"); if(b) b.setAttribute("aria-label", `Tamaño del texto: ${["normal","grande","muy grande"][ZOOMS.indexOf(S.zoom)] || "normal"}`); }
document.getElementById("tsize").addEventListener("click", () => { S.zoom = ZOOMS[(ZOOMS.indexOf(S.zoom) + 1) % ZOOMS.length]; save(); applyZoom(); });
applyZoom();

/* ---------- app feel ---------- */
// iPhone ignores user-scalable=no; this stops pinch zoom in the home-screen app (she has the text-size button instead).
document.addEventListener("gesturestart", e => e.preventDefault());
// Keep the page behind a full-screen layer still; on iPhone it scrolls underneath otherwise.
let lockedY = null;
function lockScroll(on){
  const b = document.body;
  if(on && lockedY === null){ lockedY = scrollY; Object.assign(b.style, {position: "fixed", top: `-${lockedY}px`, left: "0", right: "0"}); }
  if(!on && lockedY !== null){ Object.assign(b.style, {position: "", top: "", left: "", right: ""}); scrollTo(0, lockedY); lockedY = null; }
}

/* ---------- practice mode: one step per screen, screen kept awake ---------- */
let wake = null;
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    if(!on && wake){ await wake.release(); wake = null; }
  }catch(e){ wake = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && document.querySelector(".practice")) keepAwake(true); });
function openPractice(l, onChange){
  const n = l.steps.length;
  let k = Math.max(0, l.steps.findIndex((_, i) => !(S.steps[l.id] || []).includes(i)));
  const ov = document.createElement("div");
  ov.className = "practice"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Modo práctica");
  document.body.appendChild(ov); lockScroll(true);
  keepAwake(true);
  const mark = i => { const set = new Set(S.steps[l.id] || []); set.add(i); S.steps[l.id] = [...set]; save(); onChange(); };
  function close(){ keepAwake(false); ov.remove(); lockScroll(false); document.removeEventListener("keydown", onKey); }
  function draw(){
    const end = k >= n;
    ov.innerHTML = `
     <div class="pr-top"><span class="eyebrow">${esc(l.title)}</span><button type="button" class="pr-x" data-x aria-label="Cerrar modo práctica">✕</button></div>
     <div class="progress" aria-hidden="true"><i style="width:${(Math.min(k,n)/n*100).toFixed(1)}%"></i></div>
     <div class="pr-body">
      ${end ? `<span class="eyebrow">¡Pasos completados!</span><p class="pr-step">Ahora, tu misión:</p><p class="pr-mission">${fmt(l.mission)}</p>`
            : `<span class="eyebrow">Paso ${k+1} de ${n}</span><p class="pr-step">${fmt(l.steps[k])}</p>`}
     </div>
     <div class="pr-nav">
      ${end ? `<button type="button" class="btn btn-ghost" data-prev>Anterior</button><button type="button" class="btn btn-primary" data-x>Volver a la lección</button>`

// She picks a photo; the app reads its camera settings and hands the photo plus a ready-written
// message (lesson goal, her notebook, the settings) to the Claude app through the iPhone share sheet.
// The review runs on her own Claude account; this app uploads nothing.
const plain = s => String(s || "").replace(/<[^>]+>/g, "").replace(/\[\[(.+?)\]\]/g, "$1").replace(/\{\{(.+?)\}\}/g, (m, i) => i.split("|")[0]).replace(/\s+/g, " ").trim();

// Minimal EXIF reader for camera JPEGs: just the fields that explain how a photo looks.
function readExif(buf){
  try{
    const v = new DataView(buf);
    if(v.getUint16(0) !== 0xFFD8) return null;
    let o = 2, t = -1;
    while(o + 10 < v.byteLength){
      const m = v.getUint16(o), len = v.getUint16(o + 2);
      if((m & 0xFF00) !== 0xFF00 || m === 0xFFDA) return null;
      if(m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966){ t = o + 10; break; }
      o += 2 + len;
    }
    if(t < 0) return null;
    const le = v.getUint16(t) === 0x4949;
    const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le), s32 = p => v.getInt32(p, le);
    const SZ = {1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8};
    const ifd = (p, out) => {
      const n = u16(t + p);
      for(let i = 0; i < n; i++){
        const e = t + p + 2 + i * 12, tag = u16(e), type = u16(e + 2), count = u32(e + 4), size = (SZ[type] || 1) * count;
        const d = size > 4 ? t + u32(e + 8) : e + 8;
        if(d + size > v.byteLength) continue;
        if(type === 2){ let s = ""; for(let k = 0; k < count; k++){ const c = v.getUint8(d + k); if(!c) break; s += String.fromCharCode(c); } out[tag] = s.trim(); }
        else if(type === 3) out[tag] = u16(d);
        else if(type === 4) out[tag] = u32(d);
        else if(type === 9) out[tag] = s32(d);
        else if(type === 5) out[tag] = u32(d + 4) ? u32(d) / u32(d + 4) : 0;
        else if(type === 10) out[tag] = s32(d + 4) ? s32(d) / s32(d + 4) : 0;
      }
    };
    const a = {}, x = {};
    ifd(u32(t + 4), a);
    if(a[0x8769]) ifd(a[0x8769], x);
    const r = {};
    const make = a[0x010F] || "", model = a[0x0110] || "";
    if(model) r.camera = model.toLowerCase().startsWith(make.toLowerCase()) ? model : (make + " " + model).trim();
    if(x[0xA434]) r.lens = x[0xA434];
    const prog = {1:["M","manual (M)"], 2:["P","programa (P)"], 3:["A","prioridad a la apertura (A)"], 4:["S","prioridad a la velocidad (S)"]}[x[0x8822]];
    if(prog){ r.modeShort = prog[0]; r.mode = prog[1]; }
    const et = x[0x829A];
    if(et) r.shutter = et >= 0.3 ? (Math.round(et * 10) / 10).toString().replace(".", ",") + "″" : "1/" + Math.round(1 / et);
    if(x[0x829D]) r.aperture = "F" + (Math.round(x[0x829D] * 10) / 10);
    if(x[0x8827]) r.iso = x[0x8827];
    if(x[0x920A]) r.focal = Math.round(x[0x920A]) + " mm";
    if(x[0xA405] && r.focal && x[0xA405] !== Math.round(x[0x920A])) r.focal35 = x[0xA405] + " mm";
    const b = x[0x9204];
    if(b) r.bias = (b > 0 ? "+" : "−") + (Math.round(Math.abs(b) * 10) / 10).toString().replace(".", ",") + " EV";
    const met = {1:"promedio", 2:"ponderada al centro", 3:"puntual", 5:"multi"}[x[0x9207]]; if(met) r.metering = met;
    if(x[0xA403] !== undefined) r.wb = x[0xA403] ? "manual" : "automático";
    if(x[0x9209] !== undefined) r.flash = x[0x9209] & 1 ? "disparó" : "no disparó";
    if(x[0x9003]) r.date = x[0x9003];
    return Object.keys(r).length ? r : null;
  }catch(e){ return null; }
}

// A smaller JPEG is plenty for a review and shares quickly. Browsers apply the photo's rotation when drawing.
async function shrinkPhoto(file, max = 2048){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
  }finally{ URL.revokeObjectURL(url); }
}

function reviewPrompt(l, x, intent, typed){
  const notes = (S.notes[l.id] || "").trim();
  const set = [];
  if(x){
    [["Cámara", x.camera], ["Objetivo", x.lens], ["Modo", x.mode], ["Velocidad", x.shutter], ["Apertura", x.aperture], ["ISO", x.iso],
     ["Focal", x.focal && (x.focal + (x.focal35 ? ` (${x.focal35} equivalente)` : ""))], ["Compensación", x.bias || "0"], ["Medición", x.metering],
     ["Balance de blancos", x.wb], ["Flash", x.flash]].forEach(([k, v]) => { if(v) set.push(`${k}: ${v}`); });
  }
  if(typed.trim()) set.push(`Ajustes que recuerdo: ${typed.trim()}`);
  return `Hola, Claude. Estoy aprendiendo a usar mi primera cámara de verdad, una Sony α6500 con el objetivo 16-50 mm (F3.5–5.6). Sé de composición por usar el iPhone; lo técnico es lo que estoy aprendiendo ahora, una lección cada vez. Te adjunto una foto que hice para esta lección. Revísala como un buen profesor: amable y sincero.

LECCIÓN: ${l.title}
Objetivo de la lección: ${plain(l.goal)}
Misión de práctica: ${plain(l.mission)}
Ajustes que sugiere la lección: ${l.evf.join(" · ")}

LO QUE YO QUERÍA CONSEGUIR CON ESTA FOTO
${intent.trim() || "No lo escribí: dedúcelo de la lección y de mi cuaderno."}

MI CUADERNO DE ESTA LECCIÓN
${notes || "Vacío."}

AJUSTES DE LA FOTO (leídos del archivo)
${set.length ? set.join("\n") : "No se encontraron en el archivo. Si puedes, dedúcelos de la imagen y dime que es una suposición."}

Ponme nota según lo que pedía la lección y lo que yo quería conseguir, no según el nivel de un profesional. Un 10 quiere decir que conseguí el objetivo de la lección y lo que buscaba, aunque la foto tenga algún fallo pequeño. Una foto bonita que no practica la lección no debería sacar un 10.

Sé concreto con lo que ves en la foto: dónde cayó el enfoque, luces quemadas o sombras empastadas, movimiento, cuánto se desenfoca el fondo, el color. Usa los ajustes para explicar por qué la foto salió así. Si la foto no parece hecha para esta lección, o parece hecha con un móvil, dímelo con cariño. Elogia solo lo que de verdad funciona.

Responde en español, con frases cortas y sin tecnicismos sin explicar, con este formato:
1. Nota: X/10, y una frase con tu veredicto.
2. Objetivo de la lección: logrado, casi o todavía no.
3. Puntos de 1 a 5, con un comentario corto cada uno: lo que pedía la lección, lo que yo quería, exposición, enfoque y nitidez, composición.

7. Prueba esto: un ejercicio corto para la próxima vez que salga.
8. Para mi cuaderno: un resumen de tres líneas que pueda copiar.`;
}

function mountPhoto(el, l){
  let photo = null, exif = null, url = null;
  const fileInput = `<input type="file" accept="image/*" class="vh" id="foto-${l.id}" data-file>`;
  const pickBtn = (label, cls) => `<label class="btn ${cls}" for="foto-${l.id}">${label}</label>${fileInput}`;
  function idle(){
    el.innerHTML = `
     <p class="muted" style="font-size:15px">Cuando hayas hecho la misión, elige tu mejor foto del carrete. Se la enviamos a tu app de Claude junto con el objetivo de la lección, tu cuaderno y los ajustes de la cámara, y Claude te pone nota y te dice qué mejorar.</p>
     <div class="btn-row">${pickBtn("Elegir una foto", "btn-ghost photo-btn")}</div>`;
  }
  function chosen(){
    const chips = exif ? [exif.modeShort, exif.shutter, exif.aperture, exif.iso && "ISO " + exif.iso, exif.focal, exif.bias].filter(Boolean) : [];
    const other = exif && exif.camera && !/ILCE-6500/i.test(exif.camera);
    el.innerHTML = `
     <img class="photo-prev" src="${url}" alt="La foto que elegiste">
     ${chips.length ? `<div class="stack" style="gap:6px"><span class="eyebrow">Ajustes de la foto</span><div class="evf">${chips.map(c => `<span>${esc(c)}</span>`).join("")}</div></div>` : ""}
     ${other ? `<p class="muted" style="font-size:15px">Esta foto parece hecha con: ${esc(exif.camera)}. Para esta lección te sirve más una foto de la α6500.</p>` : ""}
     ${!chips.length ? `<label for="aj-${l.id}" class="stack" style="gap:6px"><b>No encontré los ajustes en la foto</b><span class="muted" style="font-size:15px">Si los recuerdas, escríbelos. Si no, déjalo vacío.</span></label><input id="aj-${l.id}" class="notes" data-typed placeholder="Por ejemplo: A · F5.6 · 1/250 · ISO 400" autocomplete="off">` : ""}
     <label for="int-${l.id}" class="stack" style="gap:6px"><b>¿Qué querías conseguir con esta foto?</b><span class="muted" style="font-size:15px">Opcional. Claude también lee tu cuaderno.</span></label>
     <textarea id="int-${l.id}" class="notes" rows="2" data-intent placeholder="Por ejemplo: la cara nítida y el fondo muy desenfocado"></textarea>
     <button type="button" class="btn btn-primary" data-send>Enviar a Claude</button>
     <div class="btn-row">${pickBtn("Elegir otra foto", "linkbtn")}</div>`;
  }
  function sent(how){
    el.innerHTML = `
     <div class="card stack" style="gap:8px">
      <span class="eyebrow">${how === "shared" ? "Enviado" : "Mensaje copiado"}</span>
      ${how === "shared"
        ? `<p>Elige <b>Claude</b> en la lista y envía. Si el mensaje no aparece junto a la foto, mantén pulsado el cuadro de texto y toca Pegar: ya está copiado.</p>`
        : `<p>Abre la app de Claude, adjunta esta foto desde Fotos y pega el mensaje.</p><div class="btn-row"><a class="btn btn-ghost" href="https://claude.ai/new" target="_blank" rel="noopener">Abrir Claude</a></div>`}
     </div>
     <label for="resp-${l.id}" class="stack" style="gap:6px"><b>Guarda lo que te dijo</b><span class="muted" style="font-size:15px">Pega aquí la respuesta de Claude, o solo el resumen «Para mi cuaderno», y se añadirá a tu cuaderno.</span></label>
     <textarea id="resp-${l.id}" class="notes" rows="4" data-resp></textarea>
     <button type="button" class="btn btn-primary" data-keep>Guardar en el cuaderno</button>
     <div class="btn-row"><button type="button" class="linkbtn" data-again>Enviar otra vez</button>${pickBtn("Elegir otra foto", "linkbtn")}</div>`;
  }
  function msg(text){ el.querySelectorAll(".si-msg").forEach(n => n.remove()); const p = document.createElement("p"); p.className = "si-msg"; p.setAttribute("role", "alert"); p.textContent = text; el.appendChild(p); }

  el.addEventListener("change", async e => {
    const f = e.target.closest("[data-file]"); if(!f || !f.files[0]) return;
    const file = f.files[0];
    el.innerHTML = `<p class="muted">Preparando la foto…</p>`;
    try{
      exif = /jpe?g/i.test(file.type) || !file.type ? readExif(await file.slice(0, 256 * 1024).arrayBuffer()) : null;
      photo = await shrinkPhoto(file);
      if(!photo) throw new Error("blob");
      if(url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(photo);
      chosen();
    }catch(err){ idle(); msg("No pude abrir esa foto. Prueba con otra."); }
  });
  el.addEventListener("click", async e => {
    if(e.target.closest("[data-send]") || e.target.closest("[data-again]")){
      const intent = (el.querySelector("[data-intent]") || {}).value || el.dataset.intent || "";
      const typed = (el.querySelector("[data-typed]") || {}).value || el.dataset.typed || "";
      el.dataset.intent = intent; el.dataset.typed = typed;
      const text = reviewPrompt(l, exif, intent, typed);
      const file = new File([photo], `foto-${l.id}.jpg`, {type: "image/jpeg"});
      // Copy and share in the same tap: iOS only opens the share sheet straight from a tap.
      try{ navigator.clipboard.writeText(text).catch(() => {}); }catch(err){}
      if(navigator.canShare && navigator.canShare({files: [file], text})){
        try{ await navigator.share({files: [file], text}); sent("shared"); }
        catch(err){ if(err.name !== "AbortError"){ sent("copied"); } }
      } else sent("copied");
      return;
    }
    if(e.target.closest("[data-keep]")){
      const t = el.querySelector("[data-resp]").value.trim(); if(!t) return;
      const day = new Date().toLocaleDateString("es", {day: "numeric", month: "short"});
      const prev = (S.notes[l.id] || "").trimEnd();
      S.notes[l.id] = (prev ? prev + "\n\n" : "") + `Revisión de Claude (${day}):\n${t}`;
      save();
      const ta = document.getElementById("nota-" + l.id); if(ta) ta.value = S.notes[l.id];
      el.querySelector("[data-resp]").value = "";
      msg("Guardado en tu cuaderno.");
      el.lastElementChild.style.color = "var(--ok)";
    }
  });
  idle();
}

  const n = doneCount(), all = n === LESSONS.length;

  sh.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">

    <h2 id="sheet-t">${all ? "¡Programa completado!" : `${l.proj ? "Proyecto" : "Lección"} ${l.n} completada`}</h2>
    <p class="muted">${all ? "Has terminado las 24 lecciones. Ahora, a fotografiar lo que te guste." : `Llevas ${n} de ${LESSONS.length}. ${esc(l.title)}: hecho.`}</p>
    <div class="progress" aria-hidden="true"><i style="width:${(n/LESSONS.length*100).toFixed(1)}%"></i></div>
    ${next && !all ? `<a class="btn btn-primary" href="#leccion-${next.id}">Siguiente: ${esc(next.title)}</a>` : ""}
    <button type="button" class="btn btn-ghost" data-close>${next && !all ? "Ahora no" : "Volver al programa"}</button>
   </div>`;
  document.body.appendChild(sh);
  sh.addEventListener("touchmove", e => e.preventDefault(), {passive: false}); // the page behind stays put
  const close = () => { sh.classList.add("out"); setTimeout(() => sh.remove(), 200); };
  sh.addEventListener("click", e => {
    if(e.target === sh || e.target.closest("[data-close]")){ close(); if(!next || all) location.hash = "programa"; }
    else if(e.target.closest("a")) sh.remove();
  });
  sh.querySelector(".btn").focus({preventScroll: true});
}

// Screen changes move like iOS: opening a lesson pushes it in from the right, going back slides
// from the left, switching tabs is a quick cross-fade. Re-renders in place (keepScroll) don't move.
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastHash = null;
function screenMotion(from, to){
  if(from === null || from === to || calm()) return;
  const li = x => x.startsWith("leccion-") ? LESSONS.findIndex(l => l.id === x.slice(8)) : -1;
  const a = li(from), b = li(to);
  const dx = b >= 0 && (a < 0 || b > a) ? 28 : a >= 0 ? -28 : 0;
  app.animate(dx ? [{opacity: 0, transform: `translateX(${dx}px)`}, {opacity: 1, transform: "none"}] : [{opacity: 0}, {opacity: 1}],
    {duration: dx ? 260 : 160, easing: "cubic-bezier(.25,.1,.25,1)"});
}
function route(keepScroll){
  const y = scrollY;
  const h = (location.hash || "#programa").slice(1);
  if(keepScroll !== true) screenMotion(lastHash, h);
  lastHash = h;
  app.onclick = null; app.onchange = null;
  let tab = "programa";
  if(h.startsWith("leccion-") && byId(h.slice(8))) viewLesson(byId(h.slice(8)));
  else if(h === "camara"){ tab = "camara"; viewCamera(); }
  else if(h === "simulador"){ tab = "simulador"; viewSim(); }
  else if(h === "recetas"){ tab = "recetas"; viewRecipes(); }
  else viewHome();
  document.body.classList.toggle("in-lesson", h.startsWith("leccion-"));
  document.querySelectorAll(".nav a").forEach(a => { if(a.dataset.tab === tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, keepScroll === true ? y : 0);
  updateRing();
}

      <ul class="features">
       ${[["path","Aprende paso a paso","24 lecciones cortas, desde el primer encendido hasta hacer fotos con intención."],
          ["camera","Conoce cada botón","Un mapa de la cámara: tocas una rueda o un botón y te dice para qué sirve."],
          ["sim","Practica sin gastar fotos","Un simulador para ver qué cambian la apertura, la velocidad y el ISO."],
          ["lock","Tu progreso, a salvo","Con tu cuenta, tus lecciones y tu cuaderno se guardan y nadie más puede cambiarlos."]]
         .map(([k,t,d]) => `<li>${icon(k)}<span><b>${t}</b><span class="muted">${d}</span></span></li>`).join("")}
      </ul>
      <div class="welcome-cta">
       <button type="button" class="btn btn-primary" data-go="signup">Crear mi cuenta</button>
       <button type="button" class="btn btn-ghost" data-go="login">Ya tengo cuenta</button>
      </div></div>`;
    host.querySelectorAll("[data-go]").forEach(b => b.onclick = () => login(b.dataset.go === "signup"));
  };
  const login = (signup) => {
    host.innerHTML = shell(signup ? "Crea tu cuenta" : "Entra en tu escuela",
      signup ? "Elige tu correo y una contraseña. Solo tendrás que escribirla una vez en cada dispositivo."
             : "Así tu progreso y tu cuaderno se guardan en tu cuenta y nadie más puede cambiarlos. Solo tienes que entrar una vez en cada dispositivo.",
      `<div class="si-group">` +
      field("si-email", "Correo", "email", "email", `inputmode="email" placeholder="nombre@correo.com" value="${esc(email)}"`) +
      field("si-pw", "Contraseña", "password", signup ? "new-password" : "current-password", `minlength="6" placeholder="${signup ? "Mínimo 6" : "Tu contraseña"}"`) +
      `</div><p class="si-msg" role="alert"></p><button class="btn btn-primary" type="submit">${signup ? "Crear cuenta" : "Entrar"}</button>
       <div class="btn-row" style="justify-content:space-between">
        <button class="linkbtn" type="button" data-switch>${signup ? "Ya tengo cuenta" : "Crear una cuenta"}</button>
        ${signup ? "" : `<button class="linkbtn" type="button" data-forgot>¿Olvidaste la contraseña?</button>`}
       </div>`);
    const f = host.querySelector("form");
    host.querySelector("[data-switch]").onclick = () => { email = f.querySelector("#si-email").value.trim(); login(!signup); };
    host.querySelector("[data-forgot]")?.addEventListener("click", () => { email = f.querySelector("#si-email").value.trim(); forgot(); });
    f.onsubmit = async e => {
      e.preventDefault();
      email = f.querySelector("#si-email").value.trim().toLowerCase();
      const pw = f.querySelector("#si-pw").value, b = f.querySelector("[type=submit]");
      if(!/^\S+@\S+\.\S+$/.test(email)) return msg("Escribe tu correo completo.");
      if(pw.length < 6) return msg("La contraseña necesita al menos 6 caracteres.");
      busy(b, signup ? "Creando…" : "Entrando…");
      try{ await (signup ? Sync.signUp(email, pw) : Sync.signIn(email, pw)); }
      catch(err){ idle(b); return msg(why(err, signup)); }
      done();
    };
  };
  const forgot = () => {
    host.innerHTML = shell("Recupera tu contraseña", "Te enviaremos un correo con un enlace. Ábrelo, elige una contraseña nueva y después vuelve a la app para entrar con ella.",
      `<div class="si-group">` + field("si-email", "Correo", "email", "email", `inputmode="email" placeholder="nombre@correo.com" value="${esc(email)}"`) +
      `</div><p class="si-msg" role="alert"></p><button class="btn btn-primary" type="submit">Enviar el enlace</button><button class="linkbtn" type="button" data-back>Volver</button>`);
    const f = host.querySelector("form");
    host.querySelector("[data-back]").onclick = () => login(false);
    f.onsubmit = async e => {
      e.preventDefault();
      email = f.querySelector("#si-email").value.trim().toLowerCase(); const b = f.querySelector("[type=submit]");
      busy(b, "Enviando…");
      try{ await Sync.recover(email); msg(""); b.textContent = "Enviado. Revisa tu correo (y Spam)."; }
      catch(err){ idle(b); msg(err.status === 429 ? "Has pedido varios correos seguidos. Espera un rato y vuelve a intentarlo." : "No se pudo enviar. Revisa el correo e inténtalo otra vez."); }
    };
  };
  const reset = () => {
    host.innerHTML = shell("Elige una contraseña nueva", "Después podrás entrar con ella en la app y en cualquier dispositivo.",
      `<div class="si-group">` + field("si-pw", "Nueva", "password", "new-password", `minlength="6" placeholder="Mínimo 6"`) +
      `</div><p class="si-msg" role="alert"></p><button class="btn btn-primary" type="submit">Guardar y entrar</button>`);
    const f = host.querySelector("form");
    f.onsubmit = async e => {
      e.preventDefault();
      const pw = f.querySelector("#si-pw").value, b = f.querySelector("[type=submit]");
      if(pw.length < 6) return msg("La contraseña necesita al menos 6 caracteres.");
      busy(b, "Guardando…");
      try{ await Sync.setPassword(pw); }
      catch(err){ idle(b); return msg(why(err, true)); }
      done();
    };
  };
  return {welcome, login, reset};
}
function hideSignIn(){
  document.body.classList.remove("signin-on");
  document.getElementById("signin").innerHTML = "";
  startApp();
}

// Fold-out cards (recipes, Piénsalo answers, notebook, how-to) open and close with a short height
// animation instead of snapping, the way iOS expands a row.
function foldCard(d){
  const s = d.querySelector(":scope > summary"), closing = d.open && !d._closing;
  const from = d.offsetHeight; d._a?.cancel();
  d.open = false; const shut = d.offsetHeight; d.open = true; const full = d.offsetHeight;
  d._closing = closing; d.style.overflow = "hidden";
  const a = d._a = d.animate({height: [`${from}px`, `${closing ? shut : full}px`]}, {duration: 240, easing: "cubic-bezier(.25,.1,.25,1)"});
  if(!closing) [...d.children].filter(c => c !== s).forEach(c => c.animate({opacity: [0, 1]}, {duration: 240, easing: "ease-out"}));
  a.onfinish = () => { if(d._closing) d.open = false; d._closing = false; d._a = null; d.style.overflow = ""; };
}
document.addEventListener("click", e => {
  const s = e.target.closest("details > summary"); if(!s || calm()) return;
  e.preventDefault(); foldCard(s.parentElement);
});

let started = false;
function startApp(){
  route();
  if(started) return; started = true;
  window.addEventListener("hashchange", () => route());
  // Tapping the tab you're already on scrolls back to the top, as in iPhone apps.
  document.querySelector(".nav").addEventListener("click", e => { const a = e.target.closest("a"); if(a && a.getAttribute("href") === (location.hash || "#programa")){ e.preventDefault(); scrollTo({top: 0, behavior: "smooth"}); } });
  // Bring in changes made on another device when the app opens or comes back to the foreground.
  const refresh = () => Sync.pull().then(ch => { if(ch && !document.activeElement?.matches("textarea, input") && lockedY === null) route(true); });
  refresh();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); else Sync.push(); });
  window.addEventListener("online", refresh);
}

(async () => {
  const link = new URLSearchParams(location.hash.slice(1));
  if(Sync.on && (link.has("access_token") || link.has("error_description"))){
    history.replaceState(null, "", location.pathname);
    if(link.get("type") === "recovery" && link.has("access_token")){
      try{ await Sync.fromLink(link); showSignIn().reset(); return; }catch(e){}
    }
    if(!Sync.user){ showSignIn().login(false); document.querySelector("#signin .si-msg").textContent = "El enlace ha caducado o ya se usó. Pide otro."; return; }
  }
  if(Sync.on && !Sync.user) showSignIn().welcome();
  else startApp();
})();
})();
