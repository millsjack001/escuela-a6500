</head>
<body>
<style>
/* Layout: an iPhone-native feel. Large titles, inset grouped lists, a translucent tab bar and one accent color for anything active, as in Apple's own apps and Halide. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --sunk:#E5E5EA; --ink:#111114; --muted:#5E5E63; --line:#C6C6C8;
  --accent:#B53B00; --accent-ink:#FFFFFF; --accent-soft:#FCEBE0;
  --ok:#1E7B34; --ok-ink:#FFFFFF; --ok-soft:#E2F3E6; --warn:#9A5700; --warn-soft:#FFF1D9; --bad:#D70015;
  /* Controls that must stay visible in bright sun: chevrons, check circles, field edges, progress tracks. */
  --ctl:#808086; --track:#D8D8DD; --tab-off:#636368;
  /* Tinted cards (mission, warnings). In dark mode they become neutral cards with a colored edge, not brown fills. */
  --accent-card:var(--accent-soft); --accent-edge:transparent; --warn-card:var(--warn-soft); --warn-edge:transparent;
  --bar:rgba(249,249,251,.94);
  --evf:#111114; --evf-ink:#F2F2F7; --evf-dim:#98989F; --evf-hot:#FFB020; --evf-green:#3FD07A;
  --cam:#25292D; --cam-2:#3A4046; --cam-3:#4C535A; --cam-ink:#C9CFD3; --cam-hi:#FF7A1A;
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --r:12px; --nav-h:58px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --sunk:#2C2C2E; --ink:#F2F2F7; --muted:#A8A8AE; --line:#38383A;
  --accent:#FF8A3D; --accent-ink:#1A0A00; --accent-soft:#3A2212;
  --ok:#30D158; --ok-ink:#002A0E; --ok-soft:#0F2E19; --warn:#FFB340; --warn-soft:#33240C; --bad:#FF453A;
  --ctl:#8D8D93; --track:#3A3A3C; --tab-off:#9A9AA0;
  --accent-card:var(--surface); --accent-edge:rgba(255,138,61,.55); --warn-card:var(--surface); --warn-edge:rgba(255,179,64,.55);
  --bar:rgba(22,22,24,.94);
  --evf:#000000; --evf-ink:#F2F2F7; --evf-dim:#98989F; --evf-hot:#FFB020; --evf-green:#3FD07A;
  --cam:#2C3237; --cam-2:#41484F; --cam-3:#566068; --cam-ink:#D3D9DD; --cam-hi:#FF8A33;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --sunk:#2C2C2E; --ink:#F2F2F7; --muted:#A8A8AE; --line:#38383A;
  --accent:#FF8A3D; --accent-ink:#1A0A00; --accent-soft:#3A2212;
  --ok:#30D158; --ok-ink:#002A0E; --ok-soft:#0F2E19; --warn:#FFB340; --warn-soft:#33240C; --bad:#FF453A;
  --ctl:#8D8D93; --track:#3A3A3C; --tab-off:#9A9AA0;
  --accent-card:var(--surface); --accent-edge:rgba(255,138,61,.55); --warn-card:var(--surface); --warn-edge:rgba(255,179,64,.55);
  --bar:rgba(22,22,24,.94);
  --evf:#000000; --evf-ink:#F2F2F7; --evf-dim:#98989F; --evf-hot:#FFB020; --evf-green:#3FD07A;
  --cam:#2C3237; --cam-2:#41484F; --cam-3:#566068; --cam-ink:#D3D9DD; --cam-hi:#FF8A33;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:var(--gut-l);padding-right:var(--gut-r);
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.18;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--accent);text-decoration:none}
.prose a{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit}
/* Feel like an app, not a web page: no grey tap flash, no link previews on long press, no selecting
   buttons and labels, no double-tap or pinch zoom, no rubber-band of the whole page.
   Reading text and the fields she types in stay selectable. */
html{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-x pan-y;overscroll-behavior:none;overflow-x:hidden}
body{overscroll-behavior:none;overflow-x:clip}
.prose,.goal,.think p,.callout,.mission,.table-wrap,.gloss,.recipe dl,.recipe p,.cam-info p,.review p{-webkit-user-select:text;user-select:text}
:is(.prose,.callout,.mission,.recipe,.review) :is(a,button,label,summary){-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input[type=search],textarea{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-l{display:flex;flex-direction:column;gap:32px}

/* iPhone "Aumentar contraste" (Accesibilidad): darker greys and firmer edges, both themes. */
@media (prefers-contrast: more){
  :root{--muted:#48484C; --line:#A1A1A6; --ctl:#636368; --tab-off:#48484C; --track:#C7C7CC}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#C7C7CC; --line:#636366; --ctl:#AEAEB2; --tab-off:#C7C7CC; --track:#545458}}
  :root[data-theme="dark"]{--muted:#C7C7CC; --line:#636366; --ctl:#AEAEB2; --tab-off:#C7C7CC; --track:#545458}
}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  display:flex;align-items:center;gap:10px;min-height:52px;padding-block:4px;margin:0 calc(-1 * var(--gut-r)) 8px calc(-1 * var(--gut-l));padding-inline:var(--gut-l) var(--gut-r);box-shadow:0 .5px 0 var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.brand{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .top-back{display:none;flex:1;min-width:0;margin-left:-6px}
body.in-lesson .top .brand{display:none}
body.in-lesson .top .top-back{display:inline-flex}
.brand-mark{width:28px;height:28px;border-radius:7px;flex:none;background:url(icons/icon-192.png) center/cover}
.ring{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;text-decoration:none;min-height:44px}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .rt{stroke:var(--track)}
.ring .rf{stroke:var(--ok);stroke-linecap:round;transition:stroke-dasharray .28s ease-out}

/* tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);
  padding:4px max(8px, env(safe-area-inset-right,0px)) calc(2px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.nav ul{list-style:none;margin:0 auto;padding:0;max-width:680px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tab-off);font-size:10.5px;font-weight:600;letter-spacing:0;padding:4px 2px 6px;min-height:50px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"] svg{stroke-width:2.1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;min-height:50px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--fill);color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:400;cursor:pointer;text-decoration:none;min-height:44px}
.linkbtn:active,.back:active,.ring:active,.tsize:active,.chip:active,.brand:active,.prose a:active,.recipe > a:active{opacity:.5}
.guide a:active,.steps label:active,.howto-d summary:active,.think summary:active{background:var(--sunk)}

/* home */
.hero{padding-top:6px}
.hero p{font-size:17px;color:var(--muted);max-width:60ch}
.progress{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .28s ease-out}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.continue{background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.18)}
.continue .eyebrow{color:var(--accent)}
.continue h2{font-size:24px}
.continue .btn{width:100%}
.lessons.guide a,.guide .row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;padding:13px 14px;text-decoration:none;color:var(--ink)}
.guide .chev{align-self:center}
.ico{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.guide .l-title{font-weight:600}
.guide .l-sub{line-height:1.4;display:inline-block;margin-top:2px}
.unit{display:flex;flex-direction:column;gap:8px}
.units{display:flex;flex-direction:column;gap:12px}
.unit-head{display:flex;align-items:center;gap:10px;padding-inline:4px;min-height:44px;cursor:pointer;list-style:none}
.unit-head::-webkit-details-marker{display:none}
.unit-head h2{flex:1;min-width:0}
.unit-head::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--ctl);border-bottom:2px solid var(--ctl);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
.unit[open] > .unit-head::after{transform:rotate(45deg) translate(-2px,-2px)}
.unit:not([open]){gap:0}
@media (prefers-reduced-motion: reduce){.unit-head::after{transition:none}}
.unit-head .eyebrow{font-size:15px;font-weight:400}
.lessons{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.lessons li{position:relative}
.lessons li + li::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--line)}
.lessons a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;text-decoration:none;color:var(--ink);min-height:60px}
.lessons a:active{background:var(--sunk)}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--fill);color:var(--muted)}
.num.done{background:var(--ok);color:var(--ok-ink)}
.num.proj{background:var(--accent-soft);color:var(--accent);font-size:16px}
.num.done.proj{background:var(--ok);color:var(--ok-ink)}
.num.part{box-shadow:0 0 0 2px var(--ok) inset;color:var(--ok);background:transparent}
.notes{width:100%;font:17px/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:0;border-radius:var(--r);padding:12px 14px;resize:vertical;box-shadow:0 0 0 1px var(--ctl) inset}
.notes:focus{outline:none;box-shadow:0 0 0 2px var(--accent) inset}
.l-title{font-weight:400;line-height:1.3}
.l-sub{font-size:15px;color:var(--muted)}
.chev{color:var(--ctl);font-size:22px;font-weight:600;line-height:1}

/* lesson */
.crumbs{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-6px;padding-right:8px;color:var(--accent);text-decoration:none;font-size:17px}
.back span{font-size:28px;line-height:1;font-weight:400;margin-top:-3px}
.crumbs .eyebrow{font-weight:400;font-size:15px}
.evf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:14px;font-weight:600}
.evf span{white-space:nowrap;background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;box-shadow:0 0 0 .5px var(--line) inset}
.evf .g{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.card .evf span,.continue .evf span,.recipe .evf span{background:var(--fill);box-shadow:none}
.card .evf .g,.continue .evf .g,.recipe .evf .g{background:var(--accent);color:var(--accent-ink)}
.evf .d{color:var(--muted);font-weight:500}
.goal{font-size:19px;line-height:1.42}
.prose{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.prose h3{margin-top:12px;font-size:20px;font-weight:700}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.k{display:inline-block;font-size:.8em;font-weight:600;background:var(--cam);color:var(--cam-ink);border-radius:6px;padding:1px 7px;line-height:1.5;white-space:nowrap;vertical-align:1px}
.path{display:inline;font-size:.88em;font-weight:600;background:var(--fill);border-radius:6px;padding:2px 6px;line-height:1.75;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.path .en{color:var(--muted);font-weight:400}
.callout{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.callout .eyebrow{font-size:15px;color:var(--ink)}
.c-iphone .eyebrow::before{content:"";display:inline-block;width:10px;height:16px;border:2px solid currentColor;border-radius:3px;margin-right:8px;vertical-align:-2px}
.c-warn{background:var(--warn-card);box-shadow:0 0 0 1px var(--warn-edge) inset}
.c-warn .eyebrow{color:var(--warn)}
.table-wrap{overflow-x:auto;overscroll-behavior-x:contain;border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:.5px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--muted);font-weight:600}
td:first-child{font-weight:600;white-space:nowrap}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;counter-reset:s}
.steps li{counter-increment:s;position:relative}
.steps li + li::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--line)}
.steps label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;align-items:start;padding:13px 16px 13px 14px;cursor:pointer}
.steps input{position:absolute;opacity:0;pointer-events:none}
.steps .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--ctl);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:-2px;transition:background .15s,border-color .15s}
.steps .box::before{content:counter(s)}
.steps input:checked + label > span:last-child{color:var(--muted)}
.steps input:checked + label .box{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.steps input:checked + label .box::before{content:"✓";font-size:15px}
.steps input:focus-visible + label{outline:3px solid var(--accent);outline-offset:-3px}
.think{background:var(--surface);border-radius:var(--r);padding:13px 16px}
.think summary{cursor:pointer;font-weight:600;line-height:1.4;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-13px -16px;padding:13px 16px;border-radius:var(--r)}
.think summary::-webkit-details-marker{display:none}
.think[open] summary{margin-bottom:-5px}
.think p{color:var(--muted)}
.think p b{color:var(--ink)}
.wrap{zoom:var(--zoom,1)}
.tsize{border:0;background:var(--fill);border-radius:999px;min-width:44px;height:32px;font-weight:600;font-size:13px;cursor:pointer;padding:0 10px;color:var(--accent)}
.tsize span{font-size:18px;margin-left:1px}
.outline{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding-inline:var(--gut-l) var(--gut-r);scroll-padding-inline:var(--gut-l) var(--gut-r)}
.outline::-webkit-scrollbar{display:none}
.lesson-seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:6;background:var(--bg);margin:-20px calc(-1 * var(--gut-r)) -16px calc(-1 * var(--gut-l));padding:6px var(--gut-r) 6px var(--gut-l)}
.lesson-seg .seg button{font-size:15px}
.pg-next{width:100%}
.outline .chip{flex:none}
.outline .chip{font-size:15px;min-height:34px;padding:5px 14px}
[id^="sec-"],[id^="rx-"],#glosario,[data-stage]{scroll-margin-top:72px}
.practice-btn{width:100%}
.practice{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px))}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pr-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer}
.pr-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:600px;margin:0 auto;width:100%;overflow:auto;overscroll-behavior:contain}
.pr-step{font-family:var(--f-display);font-size:clamp(24px,6.6vw,32px);line-height:1.25;font-weight:700;letter-spacing:-.02em;text-wrap:pretty}
.pr-step .path{font-size:.6em}
.pr-mission{font-size:19px;line-height:1.5}
.pr-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:600px;margin:0 auto;width:100%}
.pr-nav .btn{min-height:56px}
.pr-nav .btn:disabled{opacity:.4}
.pr-hint{text-align:center;font-size:13px;color:var(--muted);min-height:2.9em}
.gloss{display:grid;gap:0;margin:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.gloss div{padding:11px 16px;position:relative}
.gloss div + div::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.review .eyebrow{color:var(--accent)}
.mission{background:var(--accent-card);box-shadow:0 0 0 1px var(--accent-edge) inset;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}

.sheet{width:100%;max-width:680px;margin:0 auto;background:var(--surface);border-radius:14px 14px 0 0;padding:28px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:rise .28s cubic-bezier(.2,.9,.3,1)}

@keyframes fade{from{opacity:0}}

/* Gentle motion, iOS-style: short (under 300ms), eased out, no overshoot. All of it is off under reduced motion. */

/* camera map */

.cam-stage{background:var(--surface);border-radius:var(--r);padding:6px}
.cam-stage svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs .hl{fill:transparent;stroke:transparent;stroke-width:2.5}
.hs:focus-visible .hl{stroke:var(--accent)}
@media (hover:hover){.hs:hover .hl{stroke:var(--accent)}}
.hs.on .hl{stroke:var(--cam-hi);fill:rgba(255,122,26,.18)}
.hs:focus{outline:none}
.pin{fill:var(--cam-hi)}
.pin-t{fill:#111;font:700 10px var(--f-mono)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chips-row::-webkit-scrollbar{display:none}
.chips-row .chip{flex:none}
.chip{border:0;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;min-height:36px;box-shadow:0 0 0 .5px var(--line) inset}
.card .chip,.cam-info .chip{background:var(--fill);box-shadow:none}
.chip[aria-pressed="true"],.card .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* simulator */

.sim-noise{position:absolute;inset:0;mix-blend-mode:overlay;pointer-events:none;background-size:160px 160px}
.sim-osd{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));
  font:600 13px var(--f-mono);color:#EEF2EE;display:flex;gap:12px;flex-wrap:wrap;text-shadow:0 1px 2px #000}

@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){.btn,.steps .box,.howto-d summary::after,.recipe .r-head::after,.ring .rf{transition:none}.sim-osd .blink{animation:none;text-decoration:underline}.progress > i{transition:none}}
.meter{font-size:13px;color:var(--muted)}

.meter-ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end}
.meter-ticks span{width:1.5px;height:10px;background:var(--muted);position:relative}
.meter-ticks span.big{height:16px}
.meter-ticks span b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-weight:600;font-size:11px;font-variant-numeric:tabular-nums}
.meter-mark{position:absolute;bottom:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--accent);transform:translateX(-7px);transition:left .25s}
.ctrls{display:grid;gap:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 14px;position:relative}
.ctrl + .ctrl::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.ctrl .lab{font-weight:600;line-height:1.25}
.ctrl .lab small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:10px;padding:2px}
.stepper button{width:44px;height:38px;border-radius:8px;border:0;background:transparent;font-size:22px;font-weight:500;cursor:pointer;line-height:1;color:var(--ink)}
.stepper button:active{background:var(--surface)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:72px;text-align:center;font:600 17px var(--f-mono)}
.ctrl.auto output{color:var(--muted)}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.auto-tag{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.verdict{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.verdict li{background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.35}
.verdict b{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.verdict .w{background:var(--warn-card);box-shadow:0 0 0 1px var(--warn-edge) inset}

@media (max-width:340px){.verdict{grid-template-columns:1fr}}
/* simulator */
.sim{gap:12px}
.sim-wb{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none;opacity:0}
.sim-grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;stroke:rgba(255,255,255,.7);stroke-width:1}

/* the camera's MENU on the simulator screen; sizes follow the screen (container units) */
.cm{position:absolute;inset:0;background:#0A0A0B;color:#F2F2F2;display:flex;flex-direction:column;container-type:size;font-family:var(--f-body);letter-spacing:0}
.cm button{font:inherit;color:inherit;cursor:pointer}
.cm-tabs{display:flex;height:15cqh;border-bottom:1px solid #2C2C2E;flex:none}
.cm-tab{flex:1;border:0;background:none;display:grid;place-items:center;padding:0;opacity:.55}
.cm-tab.on{opacity:1;background:#2C2C2E;box-shadow:inset 0 -2px 0 currentColor}
.cm-tab svg{height:9.5cqh;width:auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cm-sub{display:flex;justify-content:space-between;align-items:center;height:10cqh;padding:0 3cqw;font-size:5cqh;color:#BDBDC2;flex:none}

.cm-title{height:12cqh;display:flex;align-items:center;gap:1.5cqw;padding:0 3cqw;font-size:5.6cqh;font-weight:600;border-bottom:1px solid #2C2C2E;flex:none}
.cm-list{flex:1;display:flex;flex-direction:column}
.cm-row{height:12cqh;flex:none;display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:0 3cqw;font-size:5.5cqh;border:0;background:none;width:100%;text-align:left}
.cm-row + .cm-row{box-shadow:inset 0 1px 0 #1E1E20}
.cm-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-row .v{color:#B0B0B5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;flex:none}
.cm-row.on{background:#E2640F;color:#fff;box-shadow:none}
.cm-row.on .v{color:#fff}
.cm-note{position:absolute;left:2cqw;right:2cqw;bottom:2cqh;background:#2C2C2E;border-radius:6px;font-size:4.8cqh;padding:2cqh 3cqw;box-shadow:0 2px 10px rgba(0,0,0,.6)}
/* the camera body: top plate, back with screen and controls, lens */
.cam{touch-action:none;background:linear-gradient(#27282B,#1A1B1D);border-radius:20px;padding:6px 6px 8px;color:#E6E6E8;box-shadow:0 10px 24px -10px rgba(0,0,0,.55),inset 0 1px 0 #3A3B3F;-webkit-user-select:none;user-select:none}
@media (max-width:700px) and (min-height:740px){.cam{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5}}

.cam-top{display:flex;align-items:center;gap:8px;height:50px;padding:0 2px 6px;border-bottom:1px solid #303134;margin-bottom:8px}
.cam-shoe{flex:1;max-width:56px;height:10px;border-radius:2px;background:#303134;box-shadow:inset 0 0 0 1px #3D3E42;margin-right:auto}
.knob{position:relative;flex:none;height:40px;border-radius:9px;overflow:hidden;touch-action:none;cursor:ew-resize;background-color:#2C2D30;box-shadow:inset 0 1px 0 #47484C,inset 0 -8px 10px -4px rgba(0,0,0,.6),0 1px 2px #000}
.knob.knurl{background-image:repeating-linear-gradient(90deg,#4A4B4F 0 2px,#202124 2px 6px)}
.knob.held{box-shadow:inset 0 0 0 1.5px #FF9F43,0 1px 2px #000}
.knob[data-knob=dial]{width:62px}
.knob.mode{width:118px}
.knob.mode::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#2C2D30,rgba(44,45,48,0) 32%,rgba(44,45,48,0) 68%,#2C2D30);pointer-events:none}
.mode-strip{position:absolute;left:50%;top:0;bottom:0;will-change:transform}
.mode-strip span{position:absolute;top:0;bottom:0;width:38px;display:grid;place-items:center;font:700 11.5px var(--f-body);color:#9A9BA0;letter-spacing:-.02em;white-space:nowrap}
.mode-strip span.on{color:#fff;font-size:14px}
.knob-idx{position:absolute;left:50%;top:0;margin-left:-5px;border:5px solid transparent;border-top-color:#FF9F43;z-index:1}
.cbtn{border:0;background:#2F3034;color:#EDEDEF;font:700 11px var(--f-body);letter-spacing:.03em;border-radius:999px;min-height:30px;padding:0 10px;cursor:pointer;box-shadow:inset 0 1px 0 #4A4B4F,0 1px 2px #000;flex:none}
.cbtn.round{width:34px;height:34px;padding:0;border-radius:50%}
.cbtn.sm{width:32px;height:32px;min-height:32px;font-size:10px}
.cbtn:active,.shutter:active{background:#48494D}
.shutter{width:46px;height:46px;border-radius:50%;border:0;background:#3A3B3F;box-shadow:0 0 0 4px #2A2B2E,inset 0 1px 0 #55565A,0 2px 3px #000;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}

.cam-back{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px;align-items:center}
.cam-right{display:flex;flex-direction:column;align-items:center;gap:6px}
.cam-row{display:flex;justify-content:space-between;align-items:center;width:100%}
.wheel{position:relative;width:92px;height:92px;border-radius:50%;touch-action:none;background:#26272A;box-shadow:inset 0 0 0 2px #4A4A4E,0 3px 8px rgba(0,0,0,.5);flex:none}

.wk{position:absolute;border:0;background:none;color:#EDEDED;font:700 10px var(--f-body);width:36px;height:30px;display:grid;place-items:center;cursor:pointer;border-radius:8px;padding:0}

.cam-lens{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #303134}

.knob.lens{flex:1;height:34px}
.cam-lens b{font:600 13px var(--f-mono);min-width:50px;text-align:right}

<script>
const APP_BUILD = "19 oct · cámara fija";
(function(){
"use strict";

/* ---------- storage (on the device, synced to Supabase when signed in) ---------- */
const KEY = "escuela-a6500-v1";
// Supabase project. Both values are public by design; row-level security keeps each account's row private.
const SB_URL = "https://otvfeelczdudtsytxbpl.supabase.co";
const SB_KEY = "sb_publishable_1Dvje4lqtDSEwvcqfmRlAw_geSndvrC";
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && typeof v === "object") return {done:v.done||{}, steps:v.steps||{}, last:v.last||null, notes:v.notes||{}, zoom:v.zoom||1, rev:v.rev||0}; }catch(e){} return {done:{}, steps:{}, last:null, notes:{}, zoom:1, rev:0}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} Sync.changed(); }
let S = load();

/* ---------- account and sync ---------- */
// Talks to Supabase's REST endpoints directly so the app needs no library and keeps working offline.
// Local changes are saved first and pushed shortly after; when she opens the app the cloud copy is pulled.
// If both sides changed since the last sync (two devices, or progress from before she signed in), they are merged.
const Sync = (() => {
  const AUTH = "escuela-a6500-auth", META = "escuela-a6500-sync";
  const on = !!(SB_URL && SB_KEY);
  const get = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  const put = (k, v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  let auth = get(AUTH), meta = get(META) || {dirty: Object.keys(S.done).length + Object.keys(S.notes).length + Object.keys(S.steps).length > 0};
  let timer = null, busy = Promise.resolve(), state = "idle", listeners = [];
  const setState = v => { state = v; listeners.forEach(f => f(v)); };
  const setMeta = m => { meta = {...meta, ...m}; put(META, meta); };

  async function call(path, opts = {}, token){
    const res = await fetch(SB_URL + path, {...opts, headers: {apikey: SB_KEY, "Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {}), ...(opts.headers || {})}});
    let body = null; try{ body = await res.json(); }catch(e){}
    if(!res.ok){ const err = new Error((body && (body.msg || body.message || body.error_description)) || ("HTTP " + res.status)); err.status = res.status; err.code = body && (body.error_code || body.code || body.error); throw err; }
    return body;
  }
  function keep(t){
    auth = {access: t.access_token, refresh: t.refresh_token, exp: Date.now() + (t.expires_in || 3600) * 1000, email: t.user ? t.user.email : auth && auth.email, uid: t.user ? t.user.id : auth && auth.uid};
    put(AUTH, auth);
  }
  async function token(){
    if(!auth) return null;
    if(Date.now() < auth.exp - 60000) return auth.access;
    try{ keep(await call("/auth/v1/token?grant_type=refresh_token", {method: "POST", body: JSON.stringify({refresh_token: auth.refresh})})); }
    catch(e){ if(e.status === 400 || e.status === 401){ signOut(true); } throw e; }
    return auth.access;
  }

  const DATA = o => ({done: o.done || {}, steps: o.steps || {}, last: o.last || null, notes: o.notes || {}, rev: o.rev || 0});
  function merge(a, b){
    // a = this device, b = cloud. Lessons and steps done anywhere stay done; notes keep both texts when they differ.
    const m = DATA(b);
    Object.keys(a.done).forEach(k => { if(a.done[k]) m.done[k] = true; });
    Object.keys(a.steps).forEach(k => { m.steps[k] = [...new Set([...(m.steps[k] || []), ...a.steps[k]])].sort((x, y) => x - y); });
    Object.keys(a.notes).forEach(k => {
      const x = (a.notes[k] || "").trim(), y = (m.notes[k] || "").trim();
      if(!y || y.includes(x)) m.notes[k] = y ? m.notes[k] : a.notes[k];
      else if(x.includes(y)) m.notes[k] = a.notes[k];
      else m.notes[k] = a.notes[k] + "\n\n" + m.notes[k];
    });
    m.last = a.last || m.last; m.rev = Math.max(a.rev || 0, m.rev);
    return m;
  }

  async function push(){
    const t = await token(); if(!t) return;
    const sent = JSON.stringify(DATA(S));
    await call("/rest/v1/progress?on_conflict=user_id", {method: "POST", headers: {Prefer: "resolution=merge-duplicates,return=minimal"}, body: JSON.stringify({user_id: auth.uid, data: JSON.parse(sent), updated_at: new Date().toISOString()})}, t);
    if(JSON.stringify(DATA(S)) === sent) setMeta({dirty: false});
  }
  async function pull(){
    const t = await token(); if(!t) return false;
    const rows = await call("/rest/v1/progress?select=data&user_id=eq." + auth.uid, {}, t);
    const remote = rows && rows[0] ? DATA(rows[0].data || {}) : null;
    const before = JSON.stringify(DATA(S));
    if(!remote){ await push(); return false; }
    const next = meta.dirty ? merge(DATA(S), remote) : remote;
    S = {...S, ...next};
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    if(meta.dirty || JSON.stringify(next) !== JSON.stringify(remote)) await push(); else setMeta({dirty: false});
    return JSON.stringify(DATA(S)) !== before;
  }
  // Runs one network job at a time so a pull never overlaps a push.
  function run(job){
    busy = busy.then(async () => {
      if(!on || !auth) return false;
      if(!navigator.onLine){ setState(meta.dirty ? "offline" : "idle"); return false; }
      setState("syncing");
      try{ const r = await job(); setState(meta.dirty ? "pending" : "ok"); return r; }
      catch(e){ setState(auth ? "error" : "idle"); return false; }
    });
    return busy;
  }
  function changed(){
    setMeta({dirty: true});
    if(!on || !auth) return;
    setState("pending");
    clearTimeout(timer); timer = setTimeout(() => run(push), 1500);
  }
  // Email + password: works entirely inside the home-screen app, with Supabase's default emails.
  async function signIn(email, password){
    keep(await call("/auth/v1/token?grant_type=password", {method: "POST", body: JSON.stringify({email, password})}));
  }
  async function signUp(email, password){
    const r = await call("/auth/v1/signup", {method: "POST", body: JSON.stringify({email, password})});
    if(!r || !r.access_token){ const e = new Error("confirm"); e.code = "confirm_needed"; throw e; }
    keep(r);
  }
  async function recover(email){
    await call("/auth/v1/recover?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {method: "POST", body: JSON.stringify({email})});
  }
  // The reset email links back here with the session in the address (#access_token=…&type=recovery).
  async function fromLink(p){
    keep({access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), expires_in: +p.get("expires_in") || 3600});
    const u = await call("/auth/v1/user", {}, auth.access);
    auth.email = u.email; auth.uid = u.id; put(AUTH, auth);
  }
  async function setPassword(password){
    await call("/auth/v1/user", {method: "PUT", body: JSON.stringify({password})}, await token());
  }
  function signOut(expired){
    const t = auth && auth.access; auth = null; put(AUTH, null);
    if(t && !expired) fetch(SB_URL + "/auth/v1/logout", {method: "POST", headers: {apikey: SB_KEY, Authorization: "Bearer " + t}}).catch(() => {});
    if(expired){ setState("expired"); return; } // keep unsynced changes; they merge in when she signs in again
    // A deliberate sign-out clears this device so the next account starts from its own cloud copy.
    S = {done: {}, steps: {}, last: null, notes: {}, zoom: S.zoom, rev: 0};
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    setMeta({dirty: false});
    setState("idle");
  }
  return {on, get user(){ return auth; }, get state(){ return state; }, onState: f => listeners.push(f), changed, pull: () => run(pull), push: () => run(push), signIn, signUp, recover, fromLink, setPassword, signOut};
})();

/* ---------- program content ---------- */
const UNITS = [
 {id:1, week:"Semana 1", title:"Primeros pasos", lessons:[
  {id:"preparar", title:"Prepara tu cámara", sub:"Batería, tarjeta, objetivo e idioma", min:15,
   evf:["BATERÍA","TARJETA","16-50 mm"],
   goal:"Dejar la cámara lista para usar: batería cargada, tarjeta formateada, objetivo puesto e idioma, fecha y hora correctos.",
   body:`
<p>En la caja vienen la cámara, la batería <b>NP-FW50</b>, un cable micro USB con su adaptador de corriente, la correa y el <b>ocular</b> (la gomita del visor, que viene suelta). La <b>tarjeta de memoria no viene incluida</b>: necesitas una tarjeta SD (SDHC o SDXC). Si vas a grabar video 4K, que sea <b>UHS-I U3</b>.</p>
<p>La batería se carga <b>dentro de la cámara</b>: con la cámara apagada, conecta el cable USB al adaptador y al enchufe. La lucecita naranja junto al puerto indica que está cargando y se apaga cuando termina (unas 2 horas y media desde vacía).</p>
<p>Tu objetivo es el <b>Sony E 16-50 mm</b>. Es motorizado: al encender la cámara se extiende solo y al apagarla se recoge. No lo fuerces con la mano.</p>
<div class="callout c-iphone"><span class="eyebrow">Diferencia con el iPhone</span><p>En el iPhone la foto siempre se guarda. Aquí la foto vive en la tarjeta: sin tarjeta no hay foto, y la cámara, de fábrica, ¡te deja disparar igual! Por eso el paso 9 es importante.</p></div>

   body:`
<p>Toca cualquier parte del esquema para ver qué es. Cambia entre la vista de atrás, de arriba y del objetivo.</p>

   body:`

<p>Al acercar el ojo al visor, un sensor apaga la pantalla y enciende el visor solo. Si ves los números del visor borrosos, gira la <b>ruedita de dioptrías</b> al lado del visor hasta verlos nítidos. La pantalla se inclina hacia arriba y hacia abajo: muy útil para fotos a ras de suelo o por encima de la gente.</p>

<li>Pulsa [[▶︎]] y gira la rueda para pasar fotos.</li>
<li><b>Ampliar:</b> el botón [[AF/MF·AEL]] tiene una lupa: en reproducción amplía la foto. La pantalla es pequeña y engaña: <b>amplía siempre las fotos importantes</b> para comprobar el enfoque.</li>
<li><b>Ver los ajustes:</b> pulsa [[DISP]] hasta ver la velocidad, el número F y el ISO de la foto. Mirar los ajustes de tus fotos buenas y malas es la forma más rápida de aprender.</li>
<li><b>Borrar:</b> botón [[C3 / 🗑]]. No se puede deshacer.</li>
</ul>
<h3>Pasarlas al iPhone</h3>
<p>Hay dos caminos. Las fotos acaban en la app <b>Fotos</b>, en Recientes, igual que las del móvil.</p>
<div class="table-wrap"><table>
<tr><th>Método</th><th>Cómo funciona</th><th>Ideal para</th></tr>
<tr><td>Wi‑Fi con la app</td><td>La app gratuita <b>Imaging Edge Mobile</b> de Sony se conecta a la red Wi‑Fi de la cámara y copia las fotos que elijas.</td><td>El día a día, sin cables. Pasa fotos JPEG.</td></tr>
<tr><td>Lector de tarjetas</td><td>Un lector de tarjetas SD para iPhone (USB‑C o Lightning). Metes la tarjeta y Fotos te ofrece importar.</td><td>Pasar muchas fotos de golpe, videos 4K o archivos RAW.</td></tr>
</table></div>
<div class="callout c-warn"><span class="eyebrow">Sobre la sincronización automática</span><p>Algunas cámaras Sony más nuevas pasan cada foto al móvil solas mientras disparas («transferencia automática en segundo plano»). Por lo que sabemos, la α6500 no tiene esa función: eres tú quien inicia la transferencia. Si en la app ves esa opción disponible para tu cámara, actívala. Si no, la rutina de abajo tarda menos de un minuto.</p></div>
<div class="callout c-iphone"><span class="eyebrow">Diferencia con el iPhone</span><p>Las fotos no aparecen solas en tu carrete: tú eliges cuáles pasar. Úsalo a tu favor y pasa solo las buenas.</p></div>`,
   steps:[
    "Pulsa [[▶︎]], recorre tus fotos y amplía una con el botón de la lupa.",
    "Pulsa [[DISP]] en reproducción hasta ver la velocidad, el F y el ISO de esa foto.",
    "Borra una foto mala con [[🗑]].",
    "Instala <b>Imaging Edge Mobile</b> desde la App Store y, cuando te lo pida, dale acceso a Fotos.",
    "En los ajustes de la app, busca el tamaño de las imágenes copiadas y elige <b>Original</b> (si no, pasa versiones pequeñas de 2 MP).",
    "En la cámara: {{MENU › Red › Enviar a smartphone › Seleccionar en este disp. › Todas imág. de esta fecha|Wireless › Send to Smartphone › Select on This Device › All Images on This Date}}. La cámara muestra un código QR.",
    "En la app, escanea el código QR. Solo hace falta la primera vez: después el iPhone recuerda la red de la cámara.",
    "Abre Fotos y comprueba que tus fotos están en Recientes. Crea un álbum «α6500» para tenerlas juntas.",
    "Prueba también el atajo: con una foto en pantalla, pulsa [[Fn]] (en reproducción es «Enviar a smartphone») y elige Esta imagen.",
    "Otra opción: {{Enviar a smartphone › Seleccionar en smartphone|Select on Smartphone}} te deja ver toda la tarjeta desde el iPhone y elegir allí."
   ],
   mission:"Haz 10 fotos, revísalas en la cámara ampliándolas, borra las que fallen y pasa las buenas al iPhone. Repite la rutina hasta que tardes menos de un minuto.",
  }
 ]},
 {id:2, week:"Semana 2", title:"Enfoque", lessons:[
  {id:"modos-enfoque", title:"Modos de enfoque", sub:"AF-S, AF-A, AF-C, DMF y MF", min:20,
   evf:["P","AF-S","AF-C"],
   goal:"Elegir si la cámara enfoca una vez y se queda quieta, o si sigue al sujeto mientras se mueve.",
   body:`
<p>A partir de aquí usa el modo <b>P</b> (Programa) del dial: la cámara sigue calculando la luz, pero te deja elegir el enfoque y casi todo lo demás. En AUTO muchos ajustes están bloqueados.</p>
<p>El modo de enfoque está en {{MENU › Ajustes de cámara 1 › Modo de enfoque|Focus Mode}} y también en el menú [[Fn]].</p>
<div class="table-wrap"><table>
<tr><th>Modo</th><th>Qué hace</th><th>Úsalo para</th></tr>
<tr><td>AF-S</td><td>Enfoca una vez y bloquea el enfoque mientras mantienes el medio disparador.</td><td>Personas posando, comida, paisajes, objetos.</td></tr>
<tr><td>AF-A</td><td>Decide solo: bloquea si el sujeto está quieto, sigue si se mueve.</td><td>Cuando no sabes qué va a pasar.</td></tr>
<tr><td>AF-C</td><td>Sigue enfocando todo el tiempo mientras mantienes el medio disparador. No pita.</td><td>Niños, mascotas, deporte, gente caminando.</td></tr>
<tr><td>DMF</td><td>Enfoca solo y luego te deja retocar a mano con el anillo.</td><td>Fotos muy de cerca.</td></tr>
<tr><td>MF</td><td>Enfocas tú con el anillo del objetivo.</td><td>Cuando el autoenfoque falla (lección «Enfoque manual»).</td></tr>
</table></div>
<h3>Cómo leer el indicador de enfoque</h3>
<p>Abajo en la pantalla hay un punto verde: <b>fijo</b> significa enfocado y bloqueado; <b>parpadeando</b> significa que no pudo enfocar; <b>con paréntesis</b> (en AF-C) significa que está siguiendo al sujeto.</p>
<p>Al autoenfoque le cuestan las cosas oscuras, las superficies lisas sin textura (una pared blanca), el cristal y los reflejos.</p>`,
   steps:[
    "Gira el dial a P.",
    "Pon el modo de enfoque en AF-S. Enfoca una taza, mantén el medio disparador y acerca o aleja la cámara: el enfoque no cambia.",
    "Cambia a AF-C. Pide a alguien que camine hacia ti y síguelo con el medio disparador presionado.",
    "Apunta a una pared lisa y mira cómo el indicador parpadea porque no encuentra qué enfocar."
   ],
   mission:"Una persona o mascota camina hacia ti: haz cinco fotos en AF-S y cinco en AF-C. Amplía en la cámara: ¿en cuál salen más nítidas?",
  },
  {id:"areas", title:"Dónde enfoca: áreas y pantalla táctil", sub:"Amplia, Zona, Punto flexible y Lock-on", min:20,
   evf:["P","AF-S","[ ▢ ] PUNTO FLEX."],
   goal:"Decidir tú qué parte de la foto queda nítida, en vez de dejar que la cámara adivine.",
   body:`
<p>El modo de enfoque dice <i>cuándo</i> enfoca. El <b>área de enfoque</b> dice <i>dónde</i>. Está en {{MENU › Ajustes de cámara 1 › Área de enfoque|Focus Area}} y en [[Fn]].</p>
<div class="table-wrap"><table>
<tr><th>Área</th><th>Qué hace</th></tr>
<tr><td>Amplia</td><td>La cámara busca el sujeto en toda la imagen. Rápido, pero a veces elige lo que no querías (normalmente lo más cercano).</td></tr>
<tr><td>Zona</td><td>Eliges una región de la pantalla y la cámara elige dentro de ella.</td></tr>
<tr><td>Centro</td><td>Siempre enfoca al centro. Perfecto con el truco de enfocar y recomponer.</td></tr>
<tr><td>Punto flexible</td><td>Un recuadro pequeño (S, M o L) que tú mueves a cualquier sitio. Máximo control.</td></tr>
<tr><td>Punto flexible ampliado</td><td>Igual, pero si no puede enfocar en el punto, usa los de alrededor.</td></tr>
<tr><td>Lock-on AF</td><td>Solo con AF-C. Engancha al sujeto y lo persigue por la pantalla.</td></tr>
</table></div>
<h3>Mover el punto con el dedo</h3>
<p>Activa {{MENU › Configuración › Funcionamiento táctil › Panel táctil+Pad|Setup › Touch Operation › Touch Panel+Pad}}. Mirando la pantalla, <b>toca</b> donde quieres enfocar. Mirando por el visor, la pantalla funciona como un <b>touchpad</b>: arrastra el pulgar y el recuadro se mueve.</p>
<div class="callout c-iphone"><span class="eyebrow">Diferencia con el iPhone</span><p>Es como tocar la pantalla del iPhone para enfocar. La diferencia es que aquí luego confirmas con el medio disparador.</p></div>
<p class="muted">En AUTO y en SCN el área queda fija en Amplia. Por eso practicas en P.</p>`,
   steps:[
    "Dial en P. Área de enfoque: Punto flexible, tamaño M.",
    "Activa el funcionamiento táctil (Panel táctil+Pad).",
    "Toca la pantalla sobre un objeto que no esté en el centro y presiona a medias: enfoca ahí.",
    "Mira por el visor y arrastra el pulgar sobre la pantalla para mover el recuadro.",
    "Prueba Amplia con varios objetos a distintas distancias. ¿Cuál elige la cámara?",
    "Con AF-C, elige Lock-on AF y sigue a algo que se mueva."
   ],
   mission:"Pon tres objetos a distintas distancias sobre una mesa. Sin mover la cámara, haz tres fotos enfocando cada vez uno distinto con el punto flexible. Es tu primera lección de dirigir la mirada de quien vea la foto.",
  },
  {id:"eyeaf", title:"Eye AF: ojos nítidos en retratos", sub:"El botón central de la rueda", min:15,
   evf:["A","AF-C","EYE AF","50 mm"],
   goal:"Hacer retratos con los ojos perfectamente enfocados, que es lo primero que mira cualquiera.",
   body:`
<p>En un retrato, si los ojos no están nítidos, la foto se siente mal aunque todo lo demás esté bien. La α6500 tiene <b>Eye AF</b>: encuentra el ojo y enfoca ahí.</p>
<p>De fábrica está en el <b>botón central de la rueda</b>. Se usa así:</p>
<ol>
<li>Apunta a la cara de la persona.</li>
<li><b>Mantén presionado</b> el botón central. Aparece un pequeño recuadro sobre el ojo.</li>
<li>Sin soltarlo, dispara.</li>
</ol>
<p>Funciona mejor en <b>AF-C</b>, porque sigue el ojo si la persona se mueve un poco.</p>
<p>Le cuesta con gafas de sol, pelo sobre los ojos, contraluz fuerte, poca luz u ojos cerrados. Si no detecta el ojo, enfoca la cara.</p>
<p class="muted">Si el botón central no hace nada, alguien cambió su función. Devuélvela en {{MENU › Ajustes de cámara 2 › Tecla personaliz. (disparo) › Botón central › Eye AF|Custom Key(Shoot.) › Center Button › Eye AF}}.</p>`,
   steps:[
    "Dial en P, modo de enfoque AF-C.",
    "Apunta a una persona a 1,5 o 2 metros con el zoom en 50 mm.",
    "Mantén el botón central y espera el recuadro sobre el ojo.",
    "Sin soltar el botón central, dispara.",
    "Amplía la foto en [[▶︎]] y comprueba que las pestañas se ven nítidas."
   ],
   mission:"Retrato junto a una ventana: persona de lado a la luz, zoom a 50 mm, Eye AF. Haz diez fotos mientras habla y se mueve. Cuenta cuántas tienen el ojo nítido.",
  },
  {id:"manual", title:"Enfoque manual con peaking", sub:"Cuando el autoenfoque se confunde", min:20,
   evf:["MF","PEAKING: MEDIO","🔍"],
   goal:"Enfocar a mano cuando el autoenfoque no puede: a través de cristales, de noche o muy de cerca.",
   body:`
<p>Elige {{Modo de enfoque › MF|Focus Mode › Manual Focus}}. Ahora el <b>anillo del objetivo enfoca</b> en vez de hacer zoom (el zoom sigue en la palanquita W/T).</p>
<p>Dos ayudas hacen que sea fácil:</p>
<ul>
<li><b>Ampliación automática:</b> al girar el anillo, la imagen se amplía para que veas el detalle. Pulsa el disparador a medias para volver a la vista completa.</li>
<li><b>Peaking (realce):</b> pinta de color los bordes que están enfocados. Actívalo en {{MENU › Ajustes de cámara 1 › Nivel de realce › Medio|Peaking Level › Mid}} y elige el color en {{Color de realce|Peaking Color}} (rojo o amarillo se ven bien).</li>
</ul>
<h3>El atajo AF/MF</h3>
<p>Con la palanca de atrás en <b>AF/MF</b>, el botón [[AF/MF·AEL]] cambia de autoenfoque a manual mientras lo pulsas. Ideal para un retoque rápido.</p>
<p class="muted">El 16-50 no enfoca más cerca de unos 25 cm (a 16 mm) o 30 cm (a 50 mm). Si estás más cerca, ningún enfoque funcionará.</p>`,
   steps:[
    "Activa el peaking en nivel Medio y color Rojo.",
    "Pon el modo de enfoque en MF.",
    "Gira el anillo despacio sobre un objeto con textura y mira cómo aparecen los bordes de color.",
    "Pulsa el disparador a medias para salir de la ampliación y dispara.",
    "Vuelve a AF-S y prueba el atajo: palanca en AF/MF, mantén el botón y gira el anillo."
   ],
   mission:"Fotografía algo a través de una ventana con gotas, una reja o una cortina fina. Primero en automático (verás que enfoca en el cristal) y luego en manual, enfocando lo de detrás.",
  }
 ]},
 {id:3, week:"", title:"La luz y la exposición", lessons:[
  {id:"luz", title:"Aprende a ver la luz", sub:"Dirección, calidad y hora del día", min:20,
   evf:["☀ LATERAL","CONTRALUZ","HORA DORADA"],
   goal:"Fijarte en la luz antes de tocar ningún ajuste, porque la luz decide la foto más que la cámara.",
   body:`
<p>Ya sabes componer. El siguiente salto no está en la cámara: está en <b>ver la luz</b>. Antes de levantar la cámara, pregúntate siempre: <b>¿de dónde viene la luz y cómo es?</b></p>
<h3>Dirección</h3>
<div class="table-wrap"><table>
<tr><th>Luz</th><th>Qué hace</th></tr>
<tr><td>De frente</td><td>Ilumina todo por igual. Plana, sin volumen. Segura, pero aburrida.</td></tr>
<tr><td>Lateral</td><td>Crea sombras que dan volumen y textura. La favorita para retratos con carácter, comida y objetos.</td></tr>
<tr><td>Contraluz</td><td>Siluetas, pelo brillante, ambiente. Hay que decidir si quieres silueta o cara expuesta (lecciones «Más clara o más oscura» y «Poca luz y flash»).</td></tr>
<tr><td>Cenital</td><td>Sol de mediodía desde arriba: sombras duras bajo los ojos. Busca sombra.</td></tr>
</table></div>
<h3>Calidad</h3>
<p><b>Dura:</b> fuente pequeña o lejana (sol directo, una bombilla desnuda). Sombras con bordes marcados. <b>Suave:</b> fuente grande (cielo nublado, sombra abierta, una ventana grande). Sombras suaves, piel favorecida.</p>
<h3>Hora</h3>
<p>La <b>hora dorada</b> (la primera y la última hora de sol) da luz cálida, baja y lateral. La <b>hora azul</b> (justo después del atardecer) da cielos azul intenso con las luces de la ciudad encendidas.</p>
<div class="callout c-iphone"><span class="eyebrow">Diferencia con el iPhone</span><p>El iPhone combina varias fotos para aclarar sombras y oscurecer cielos, así que todo se ve «bien iluminado». La α6500 hace una sola foto: verás contrastes y sombras más fuertes. No es un fallo, es la luz real, y aprender a usarla es lo que hará tus fotos distintas a las de un móvil.</p></div>`,
   steps:[
    "Siéntate junto a una ventana y mira cómo cae la luz sobre tu mano al girarla.",
    "Pide a alguien que se ponga de frente a la ventana, de lado y de espaldas. Observa su cara en cada posición.",
    "Sal a la calle a mediodía y busca una sombra abierta (bajo un portal o un árbol grande). Compara la cara de alguien al sol y en la sombra.",
    "Mira el cielo al atardecer cada 10 minutos durante media hora y fíjate en cómo cambia el color de la luz."
   ],
   mission:"<b>Cuatro luces, un objeto.</b> Una fruta o una taza junto a una ventana: luz de frente, de lado, desde atrás y en sombra. Mismos ajustes en las cuatro fotos (modo A, F5.6). Solo cambia la luz. ¿Cuál tiene más volumen?"
  },
  {id:"triangulo", title:"El triángulo de exposición", sub:"Apertura, velocidad e ISO", min:20,
   evf:["P","1/125","F5.6","ISO AUTO"], sim:"P",
   goal:"Entender las tres formas que tiene la cámara de conseguir luz y qué precio paga cada una.",
   body:`
<p>Una foto es luz que llega al sensor. Hay tres llaves para controlar cuánta llega, y cada una cambia algo más en la foto:</p>
<div class="table-wrap"><table>
<tr><th>Llave</th><th>Qué es</th><th>Más luz</th><th>Efecto secundario</th></tr>
<tr><td>Apertura (F)</td><td>El tamaño del agujero del objetivo.</td><td>Número F más bajo</td><td>Fondo más desenfocado</td></tr>
<tr><td>Velocidad</td><td>Cuánto tiempo está abierto el obturador.</td><td>Tiempo más largo</td><td>Lo que se mueve sale borroso</td></tr>
<tr><td>ISO</td><td>Cuánto amplifica el sensor la luz.</td><td>Número más alto</td><td>Más ruido (granito)</td></tr>
</table></div>
<p>Piensa en llenar un vaso bajo el grifo: puedes abrir más el grifo (apertura), dejarlo más tiempo (velocidad) o usar un vaso más pequeño (ISO). Las tres llenan el vaso.</p>
<p>Los fotógrafos hablan de <b>pasos</b>: un paso es el doble o la mitad de luz. 1/250 a 1/125 es un paso. ISO 400 a 800 es un paso. F5.6 a F4 también.</p>
<h3>Quién decide qué</h3>
<div class="table-wrap"><table>
<tr><th>Modo</th><th>Tú eliges</th><th>La cámara elige</th></tr>
<tr><td>AUTO</td><td>Nada</td><td>Todo</td></tr>
<tr><td>P</td><td>ISO y estilo</td><td>Apertura y velocidad</td></tr>
<tr><td>A</td><td>Apertura</td><td>Velocidad</td></tr>
<tr><td>S</td><td>Velocidad</td><td>Apertura</td></tr>
<tr><td>M</td><td>Las dos</td><td>Nada (o el ISO, si está en AUTO)</td></tr>
</table></div>
<p>Abre el simulador y juega antes de tocar la cámara. Cambia de escena y de modo, y mira qué decide la cámara.</p>`,
   steps:[
    "En el simulador, modo P: cambia la escena de Sol a Noche y mira cómo cambian los tres valores.",
    "En la cámara, dial en P. Presiona a medias y lee abajo en la pantalla: velocidad, F e ISO.",
    "Apunta a una zona luminosa y luego a una oscura. Mira cómo cambian los números.",
    "En P, gira el dial de control con el disparador a medias: la P se convierte en P* y cambias la pareja apertura-velocidad sin cambiar el brillo."
   ],
   mission:"Diario de luz: en P, anota la velocidad, F e ISO que elige la cámara en cuatro lugares (sol directo, sombra, interior de casa y de noche). Verás que de noche todo se dispara: velocidad lenta e ISO alto.",
  },
  {id:"apertura", title:"Apertura y modo A", sub:"Fondo desenfocado o todo nítido", min:25,
   evf:["A","F5.6","50 mm","ISO AUTO"], sim:"A",
   goal:"Controlar cuánto de la foto queda nítido: solo el sujeto, o todo de delante a atrás.",
   body:`
<p>Gira el dial a <b>A</b> (prioridad a la apertura). Con el <b>dial de control</b> de arriba eliges el número F y la cámara pone la velocidad.</p>
<ul>
<li><b>Número F bajo</b> (F3.5 a F5.6): agujero grande, mucha luz, <b>poca profundidad de campo</b>: el sujeto nítido y el fondo desenfocado. Ideal para retratos.</li>
<li><b>Número F alto</b> (F8 a F11): agujero pequeño, <b>todo nítido</b>. Ideal para paisajes y grupos.</li>
</ul>
<h3>Lo que debes saber de tu objetivo</h3>
<p>El 16-50 es <b>F3.5–5.6</b>: el F más bajo depende del zoom. A 16 mm llega a F3.5, pero a 50 mm solo a F5.6. Para el fondo más desenfocado posible con este objetivo, la receta es:</p>
<ol>
<li>Zoom a <b>50 mm</b> y F lo más bajo posible (F5.6).</li>
<li><b>Acércate</b> al sujeto (1 a 1,5 m para un retrato de busto).</li>
<li>Que el fondo esté <b>lejos</b> del sujeto (varios metros).</li>
</ol>
<p>La distancia importa tanto como la apertura. Un fondo pegado a la persona nunca se desenfoca mucho.</p>
<p>El objetivo da su mejor nitidez alrededor de <b>F8</b>. A partir de F16 la imagen se suaviza un poco por difracción.</p>
<div class="callout c-warn"><span class="eyebrow">Si un número parpadea</span><p>Si la velocidad parpadea en pantalla, la cámara no puede compensar la apertura que elegiste (demasiada o muy poca luz). Cambia la apertura o el ISO.</p></div>`,
   steps:[
    "En el simulador, modo A: mueve la apertura de F5.6 a F22 con el zoom en 50 mm y mira el fondo.",
    "En la cámara, dial en A e ISO en AUTO.",
    "Zoom a 50 mm, gira el dial de control hasta F5.6.",
    "Fotografía una taza o una flor a un metro con el fondo lejos.",
    "Sin moverte, sube a F16 y repite."
   ],
   mission:"<b>Fondo cremoso.</b> Retrato de busto a 50 mm y F5.6, con la persona a varios metros de la pared o los árboles de detrás. Luego la misma foto con la persona pegada a la pared. Compara.",
  },
  {id:"velocidad", title:"Velocidad y modo S", sub:"Congelar o dibujar el movimiento", min:25,
   evf:["S","1/1000","1/15","STEADYSHOT"], sim:"S",
   goal:"Decidir si el movimiento sale congelado o como una estela, y evitar fotos movidas.",
   body:`
<p>Gira el dial a <b>S</b> (prioridad a la velocidad). Con el <b>dial de control</b> eliges la velocidad y la cámara pone la apertura.</p>
<div class="table-wrap"><table>
<tr><th>Velocidad</th><th>Resultado</th></tr>
<tr><td>1/1000 o más</td><td>Congela salpicaduras, saltos y deporte.</td></tr>
<tr><td>1/500</td><td>Congela niños y mascotas corriendo.</td></tr>
<tr><td>1/250</td><td>Gente caminando nítida.</td></tr>
<tr><td>1/60 a 1/125</td><td>Personas quietas, uso diario.</td></tr>
<tr><td>1/15 a 1/2</td><td>Agua sedosa, estelas. Hay que apoyar la cámara.</td></tr>
</table></div>
<h3>Foto movida o sujeto movido</h3>
<p>Si <b>toda</b> la foto sale borrosa, se movió la cámara (trepidación). Si solo sale borroso lo que se mueve, es el sujeto. Regla: sin estabilizador, no bajes de <b>1 / (mm × 1,5)</b>: a 50 mm, unos 1/80.</p>
<p>Tu α6500 tiene <b>SteadyShot</b> (estabilizador dentro del cuerpo) y el objetivo tiene el suyo. Juntos te dejan ir unos pasos más lento con sujetos quietos. Revisa que esté activo: {{MENU › Ajustes de cámara 2 › SteadyShot › Activado|SteadyShot › On}}. Apágalo solo si usas trípode.</p>
<p><b>Barrido:</b> a 1/30, sigue con la cámara a un ciclista mientras disparas. El ciclista sale nítido y el fondo en rayas.</p>
<div class="callout c-warn"><span class="eyebrow">Si el número F parpadea</span><p>No hay apertura que compense esa velocidad. Con poca luz, sube el ISO o elige una velocidad más lenta.</p></div>`,
   steps:[
    "En el simulador, modo S: pon 1/2000 y luego 1/15 y mira al ciclista.",
    "En la cámara, dial en S, ISO en AUTO.",
    "Comprueba que el SteadyShot esté activado.",
    "Fotografía a alguien caminando a 1/500 y a 1/15.",
    "Apoya la cámara en una mesa y prueba la foto más lenta que te salga nítida."
   ],
   mission:"<b>Agua.</b> Un grifo o una fuente: una foto a 1/1000 (gotas congeladas) y otra a 1/15 o más lenta, con la cámara apoyada (agua de seda). Usa el temporizador de 2 s si tienes dónde apoyarla.",
  },
  {id:"iso", title:"ISO sin miedo", sub:"Cuándo subirlo y hasta dónde", min:15,
   evf:["ISO 100","ISO 6400","AUTO"], sim:"A",
   goal:"Usar el ISO para salvar fotos con poca luz, sabiendo cuánto ruido aceptas.",
   body:`
<p>Pulsa el <b>lado derecho</b> de la rueda ([[ISO]]). Va de <b>ISO 100</b> a <b>51200</b>, o <b>AUTO</b>.</p>
<ul>
<li><b>100–400:</b> día, máxima calidad.</li>
<li><b>800–3200:</b> interiores y atardecer. En esta cámara se ve muy limpio.</li>
<li><b>6400:</b> noche. Algo de grano, pero aceptable.</li>
<li><b>12800 o más:</b> emergencias. Mejor una foto con grano que una foto movida.</li>
</ul>
<p><b>ISO AUTO</b> es tu mejor amigo al principio: de fábrica se mueve entre 100 y 6400. Puedes cambiar ese rango: con ISO AUTO seleccionado, pulsa el lado derecho de la rueda y ajusta el máximo y el mínimo.</p>
<p>También puedes decirle a la cámara cuándo empezar a subir el ISO con {{MENU › Ajustes de cámara 1 › ISO AUTO vel. obt. mín.|ISO AUTO Min. SS}}. Para niños y mascotas, elige «Más rápido».</p>
<p class="muted">Truco para escenas quietas de noche: el ajuste Multi Frame NR (en la lista de ISO) hace varias fotos y las combina para reducir ruido. Solo funciona en JPEG.</p>`,
   steps:[
    "Pulsa ISO (lado derecho de la rueda) y recorre los valores.",
    "Elige ISO AUTO y pulsa el lado derecho para ver el rango mínimo y máximo.",
    "En el simulador, escena Interior, modo A: cambia entre ISO 100 y AUTO y mira la velocidad."
   ],
   mission:"Misma escena dentro de casa con la cámara apoyada: ISO 100, 1600, 6400 y 25600. Amplíalas en el móvil. ¿Desde cuál te molesta el grano? Ése es tu límite personal: ponlo como máximo de ISO AUTO.",
  },
  {id:"compensacion", title:"Más clara o más oscura", sub:"Compensación, histograma y medición", min:20,
   evf:["A","±0.0","+0.7","HISTOGRAMA"],
   goal:"Corregir el brillo cuando la cámara se equivoca, y saber leer si una foto está quemada.",
   body:`
<p>La cámara intenta que todo quede de un brillo «medio». Por eso la nieve o una pared blanca salen grisáceas, y un gato negro sale gris. Tú la corriges con la <b>compensación de exposición</b>:</p>
<p>Pulsa el <b>lado de abajo</b> de la rueda ([[±]]) y gírala: <b>+</b> aclara, <b>−</b> oscurece. Va de −5 a +5, en tercios de paso. Funciona en P, A y S (en M, solo con ISO AUTO). En AUTO no está disponible.</p>
<ul>
<li>Nieve, playa, fondo blanco: <b>+0.7 a +1.3</b>.</li>
<li>Escenario, fondo negro, atardecer intenso: <b>−0.7 a −1.3</b>.</li>
</ul>
<h3>El histograma</h3>
<p>Es una gráfica del brillo: sombras a la izquierda, luces a la derecha. Si la montaña choca contra el borde derecho, hay zonas <b>quemadas</b> (blanco sin detalle, no se recupera). Se ve pulsando [[DISP]]. Si no aparece, actívalo en {{MENU › Ajustes de cámara 2 › Botón DISP › Monitor › Histograma|DISP Button › Monitor › Histogram}}.</p>
<h3>Medición</h3>
<p>{{MENU › Ajustes de cámara 1 › Modo medición|Metering Mode}}. <b>Multi</b> (de fábrica) va bien casi siempre. <b>Puntual</b> mide solo el centro: útil en contraluz para exponer bien una cara.</p>
<p>Con la palanca en <b>AEL</b>, el botón [[AF/MF·AEL]] congela la exposición mientras lo mantienes: mides en la cara, mantienes, recompones y disparas.</p>`,
   steps:[
    "Dial en A. Pulsa el lado de abajo de la rueda y gira hasta +1.0. Mira cómo se aclara la pantalla.",
    "Vuelve a 0.0 (no olvides esto: la compensación se queda puesta).",
    "Pulsa [[DISP]] hasta ver el histograma. Si no aparece, actívalo en el menú.",
    "Apunta a una ventana muy luminosa y mira cómo el histograma choca contra la derecha."
   ],
   mission:"Fotografía algo blanco (un papel o una pared) en A sin compensar: saldrá gris. Repite a +1.0. Luego algo negro a 0 y a −1.0.",
  },
  {id:"manualm", title:"Modo M: tú decides todo", sub:"La escala de exposición", min:25,
   evf:["M","1/125","F8","ISO 100","±0.0"], sim:"M",
   goal:"Fijar apertura y velocidad a la vez, usando la escala de la pantalla como guía.",
   body:`
<p>Gira el dial a <b>M</b>. De fábrica:</p>
<ul>
<li><b>Rueda de control</b> (atrás): velocidad.</li>
<li><b>Dial de control</b> (arriba): apertura.</li>
</ul>
<p>Si el ISO está fijo, aparece una escala marcada <b>MM</b> con un número: <b>0.0</b> es lo que la cámara cree correcto, <b>+</b> saldrá más clara, <b>−</b> más oscura. El método:</p>
<ol>
<li>Elige la apertura por la profundidad de campo que quieres.</li>
<li>Elige la velocidad por el movimiento.</li>
<li>Ajusta el ISO (o uno de los dos) hasta que la escala quede cerca de 0.</li>
</ol>
<p><b>M con red de seguridad:</b> pon ISO en AUTO. Tú eliges apertura y velocidad, y la cámara ajusta el ISO. Muy útil para deporte o niños: velocidad rápida fija y apertura abierta.</p>
<h3>Cuándo usar M</h3>
<ul>
<li>Cuando quieres que todas las fotos de una serie tengan el mismo brillo (panorámicas, fotos de producto).</li>
<li>De noche o con flash.</li>
<li>Cuando la cámara se deja engañar por fondos muy claros u oscuros.</li>
</ul>
<p class="muted">Si prefieres el ajuste al revés (apertura atrás, velocidad arriba): {{MENU › Ajustes de cámara 2 › Config. dial/rueda|Dial/Wheel Setup}}.</p>`,
   steps:[
    "En el simulador, modo M: pon F8 y 1/125, y sube y baja el ISO hasta que la marca quede en 0.",
    "En la cámara, dial en M, ISO en 100.",
    "Gira la rueda de atrás (velocidad) y el dial de arriba (apertura) hasta ver 0.0 en la escala.",
    "Prueba ISO AUTO en M y mira cómo la escala desaparece y el ISO cambia solo."
   ],
   mission:"Al atardecer: en M, F8 e ISO 100, ajusta la velocidad hasta 0.0. Luego haz una a −1 y otra a +1. Muchas veces la mejor es la −1, con colores más intensos.",
  },
  {id:"decidir", title:"De la idea al ajuste", sub:"Piensa como fotógrafa antes de disparar", min:30,
   evf:["¿QUÉ?","¿SE MUEVE?","¿NÍTIDO?","¿LUZ?","¿SENSACIÓN?"],
   goal:"Pasar de «qué botón toco» a «qué quiero contar», y que los ajustes salgan de esa decisión.",
   body:`
<p>Hasta aquí has aprendido qué hace cada ajuste. Un fotógrafo trabaja al revés: <b>primero decide qué quiere contar</b> y después elige los ajustes que lo consiguen. Estas cinco preguntas sirven para cualquier foto. Con práctica tardan tres segundos.</p>
<div class="table-wrap"><table>
<tr><th>Pregunta</th><th>Decide</th></tr>
<tr><td>1. ¿Qué es lo importante?</td><td>Dónde enfocas (área, Eye AF) y dónde lo colocas en el encuadre.</td></tr>
<tr><td>2. ¿Se mueve? ¿Congelado o con movimiento?</td><td>La velocidad.</td></tr>
<tr><td>3. ¿Qué debe verse nítido: solo el sujeto o todo?</td><td>La apertura, el zoom y tu distancia.</td></tr>
<tr><td>4. ¿Hay luz para todo eso?</td><td>El ISO, apoyar la cámara o usar flash.</td></tr>
<tr><td>5. ¿Qué sensación quiero?</td><td>El brillo (compensación) y el color (balance de blancos, estilo).</td></tr>
</table></div>
<h3>Cómo elegir el modo</h3>
<ul>
<li>Si manda el <b>movimiento</b> (pregunta 2): modo <b>S</b>.</li>
<li>Si manda <b>qué se ve nítido</b> (pregunta 3): modo <b>A</b>.</li>
<li>Si mandan <b>las dos</b> a la vez: modo <b>M con ISO AUTO</b>.</li>
<li>Si nada se mueve y el fondo da igual: <b>A en F8</b> es un buen punto de partida.</li>
</ul>
<div class="table-wrap"><table>
<tr><th>Quiero…</th><th>Prioridad</th><th>Ajuste</th></tr>
<tr><td>Aislar a una persona</td><td>Apertura</td><td>A, F5.6 a 50 mm, cerca de ella y lejos del fondo</td></tr>
<tr><td>Que se lea todo el paisaje</td><td>Apertura</td><td>A, F8–F11, 16 mm</td></tr>
<tr><td>Congelar un salto</td><td>Velocidad</td><td>S, 1/1000, AF-C, ráfaga</td></tr>
<tr><td>Agua sedosa</td><td>Velocidad</td><td>S, 1/8 o más lenta, cámara apoyada</td></tr>
<tr><td>Niño corriendo y fondo borroso</td><td>Las dos</td><td>M, F5.6, 1/1000, ISO AUTO</td></tr>
<tr><td>El ambiente de una cena con velas</td><td>Luz</td><td>A, F3.5 a 16 mm, ISO alto, sin flash, balance cálido</td></tr>
<tr><td>Una silueta al atardecer</td><td>Brillo</td><td>Compensación −1 a −2, midiendo el cielo</td></tr>
</table></div>
<h3>El planificador</h3>
<p>Describe la foto que quieres y mira qué ajustes propone y por qué. También lo tienes en la pestaña Recetas.</p>
<div data-widget="planner"></div>
<div class="callout c-iphone"><span class="eyebrow">Cuando una foto no sale</span><p>No culpes a la cámara: vuelve a las cinco preguntas y busca cuál respondiste sin pensar. Anótalo en tu cuaderno.</p></div>`,
   steps:[
    "Repite las cinco preguntas en voz alta hasta sabértelas.",
    "Usa el planificador con tres situaciones de tu vida: tu casa, tu trabajo y un paseo.",
    "Hoy, antes de cada foto, responde las cinco preguntas mentalmente.",
    "En tu cuaderno, para tres fotos, escribe qué querías y qué ajuste lo consiguió."
   ],
   mission:"<b>Tres intenciones, un sujeto.</b> Elige a una persona o un lugar y haz tres fotos con intenciones distintas: una que lo aísle (fondo borroso), una que lo sitúe en su entorno (todo nítido) y una que muestre movimiento o el paso del tiempo. Antes de cada una, di en voz alta qué quieres y qué ajuste lo consigue.",
  }
 ]},
 {id:4, week:"Semana 4", title:"Color y edición", lessons:[
  {id:"balance", title:"Balance de blancos", sub:"Que el blanco salga blanco", min:20,
   evf:["AWB","☀ 5500K","💡 3200K"],
   goal:"Entender por qué las fotos salen amarillas o azules, y corregirlo o usarlo a propósito.",
   body:`
<p>Cada luz tiene un color: la bombilla de casa es naranja, la sombra es azulada, el mediodía es neutro. Tus ojos lo corrigen sin que lo notes; la cámara tiene que adivinarlo. Eso es el <b>balance de blancos</b> (WB), y se mide en grados <b>Kelvin</b>.</p>
<p>Prueba aquí: elige la luz real de la escena y luego el ajuste de la cámara. La taza es blanca en la vida real.</p>
<div data-widget="wb"></div>
<p>Está en {{MENU › Ajustes de cámara 1 › Balance blancos|White Balance}} y en [[Fn]]. Opciones:</p>
<ul>
<li><b>Auto (AWB):</b> acierta casi siempre al aire libre.</li>
<li><b>Luz diurna, Sombra, Nublado, Incandescente, Fluorescente, Flash:</b> preajustes para cada luz.</li>
<li><b>Temp. color/Filtro:</b> eliges los Kelvin a mano.</li>
<li><b>Personalizado:</b> fotografías algo blanco bajo esa luz y la cámara aprende el color. Lo más preciso.</li>
</ul>
<p>En cualquier ajuste, pulsa el lado derecho de la rueda para afinar hacia ámbar, azul, verde o magenta.</p>
<p><b>Truco creativo:</b> en un atardecer, Auto «corrige» el naranja y lo apaga. Pon <b>Luz diurna</b> o <b>Nublado</b> y el atardecer sale cálido como lo viste.</p>`,
   steps:[
    "En la demostración: luz Bombilla con ajuste Luz diurna. Luego cambia a Incandescente.",
    "En la cámara, abre el balance de blancos desde [[Fn]].",
    "Bajo una lámpara de casa, haz una foto en Auto y otra en Incandescente.",
    "Prueba el ajuste fino: pulsa el lado derecho y mueve hacia ámbar."
   ],
   mission:"Una misma escena con luz de lámpara amarilla: Auto, Incandescente y Luz diurna. ¿Cuál te gusta más? No hay respuesta correcta: a veces el color cálido es la gracia.",
  },
  {id:"estilos", title:"Estilos creativos y DRO", sub:"El «filtro» de la cámara", min:15,
   evf:["ESTILO: ESTÁNDAR","DRO AUTO"],
   goal:"Ajustar el aspecto de los colores desde la cámara, como un filtro pero bien hecho.",
   body:`
<p>{{MENU › Ajustes de cámara 1 › Estilo creativo|Creative Style}}. Elige un estilo y, con los lados de la rueda, ajusta <b>contraste</b>, <b>saturación</b> y <b>nitidez</b> de −3 a +3.</p>
<div class="table-wrap"><table>
<tr><th>Estilo</th><th>Para qué</th></tr>
<tr><td>Estándar</td><td>Uso general.</td></tr>
<tr><td>Vívido</td><td>Más color y contraste: flores, cielos, mar.</td></tr>
<tr><td>Neutro</td><td>Colores suaves; ideal si vas a editar.</td></tr>
<tr><td>Retrato</td><td>Piel más suave y natural.</td></tr>
<tr><td>Paisaje</td><td>Verdes y azules intensos, nítido.</td></tr>
<tr><td>Ocaso</td><td>Realza rojos y naranjas.</td></tr>
<tr><td>Blanco y negro / Sepia</td><td>Monocromo. Sube el contraste para un look clásico.</td></tr>
</table></div>
<p>También hay Claro, Profundo, Luz, Escena nocturna y Hojas de otoño.</p>
<h3>DRO: rescatar sombras</h3>
<p>{{MENU › Ajustes de cámara 1 › DRO/HDR auto › Optimiz. gama D|DRO/Auto HDR › D-Range Opt.}}. En <b>Auto</b> aclara las sombras en escenas con mucho contraste, como un contraluz. Déjalo en Auto.</p>
<p class="muted">Los estilos solo afectan a las fotos JPEG. Los «Efectos foto» (cámara de juguete, color parcial, miniatura, acuarela…) son más extremos y se encuentran en {{Efecto foto|Picture Effect}}.</p>`,
   steps:[
    "Abre Estilo creativo y recorre la lista con la rueda.",
    "Elige Blanco y negro y sube el contraste a +2.",
    "Comprueba que DRO esté en Auto.",
    "Vuelve a Estándar al terminar."
   ],
   mission:"Un mismo paisaje o calle en Estándar, Vívido y Blanco y negro con contraste +2. Elige tu favorito para el día a día.",
  },
  {id:"rawjpeg", title:"JPEG o RAW", sub:"Calidad y tamaño de imagen", min:15,
   evf:["JPEG EXTRA FINO","RAW+J","24M"],
   goal:"Elegir el tipo de archivo adecuado ahora y saber cuándo pasarte a RAW.",
   body:`
<p>{{MENU › Ajustes de cámara 1 › Calidad|Quality}}:</p>
<ul>
<li><b>JPEG Extra fino / Fino / Estándar:</b> foto lista para compartir, con el estilo y el balance de blancos ya aplicados. Extra fino es la mejor calidad.</li>
<li><b>RAW:</b> el «negativo digital»: todos los datos del sensor sin procesar. Permite recuperar mucho más al editar (luces, sombras, balance de blancos), pero <b>hay que editarlo</b> antes de compartirlo y ocupa mucho más.</li>
<li><b>RAW y JPEG:</b> guarda los dos. Lo mejor de ambos mundos, a cambio de espacio.</li>
</ul>
<p>Como vas a pasar las fotos con la app y editarlas en <b>Fotos del iPhone</b>, usa <b>JPEG Extra fino</b>: la app transfiere los JPEG, no los RAW. Si algún día pasas las fotos con un lector de tarjetas, prueba <b>RAW y JPEG</b>: la app Fotos también abre y edita los RAW de Sony, con mucho más margen para recuperar cielos y sombras.</p>
<p>Deja el <b>Tamaño de imagen</b> en <b>L (24M)</b>, el máximo. La proporción de esta cámara es <b>3:2</b>, más alargada que el 4:3 del iPhone.</p>
<p class="muted">Con RAW, el Auto superior no puede combinar varias fotos y el ISO Multi Frame NR no está disponible.</p>`,
   steps:[
    "Pon la calidad en JPEG Extra fino.",
    "Comprueba que el tamaño de imagen esté en L.",
    "Mira en pantalla cuántas fotos te caben en la tarjeta (el número arriba)."
   ],
   mission:"Busca una escena con cielo brillante y sombras. Hazle una foto, pásala al iPhone e intenta en Fotos recuperar el cielo y aclarar las sombras. Verás cuánto margen tiene un JPEG y por qué conviene acertar la exposición desde la cámara.",
  },
  {id:"editar", title:"Elegir y editar en el iPhone", sub:"Selección y la app Fotos", min:30,
   evf:["♡ FAVORITAS","RECORTAR","LUCES","SOMBRAS"],
   goal:"Quedarte solo con tus mejores fotos y darles en Fotos un acabado sencillo y limpio.",
   body:`
<p>Los fotógrafos profesionales enseñan una de cada veinte o cincuenta fotos que hacen. <b>Elegir es la mitad de la fotografía.</b></p>
<h3>Elegir en tres pasadas</h3>
<ol>
<li><b>Descarta</b> sin pensarlo mucho: desenfocadas, movidas, ojos cerrados.</li>
<li>De cada grupo de fotos parecidas, <b>quédate con una</b> y márcala con el corazón (♡ Favorita).</li>
<li>De las favoritas, pregúntate: <b>¿esta foto cuenta lo que yo quería?</b> Si dudas, quítale el corazón.</li>
</ol>
<h3>Editar en Fotos, en este orden</h3>
<p>Abre la foto y toca <b>Editar</b>. Ve de lo general a lo particular:</p>
<ol>
<li><b>Recortar:</b> endereza el horizonte y ajusta el encuadre. Con 24 megapíxeles puedes recortar bastante, pero si recortas mucho, la próxima vez acércate más.</li>
<li><b>Exposición:</b> el brillo general.</li>
<li><b>Luces</b> (bájalas para recuperar un cielo) y <b>Sombras</b> (súbelas para ver mejor una cara).</li>
<li><b>Contraste</b> y <b>Punto negro</b>: dan fuerza sin que se vea artificial.</li>
<li><b>Calidez</b> y <b>Matiz</b>: el color de la luz (lección «Balance de blancos»).</li>
<li><b>Intensidad</b> mejor que Saturación: aviva los colores apagados sin poner naranja la piel.</li>
<li><b>Definición</b> o <b>Nitidez</b>: un poco, nunca al máximo.</li>
</ol>
<p><b>Series coherentes:</b> en una foto editada toca el menú <b>•••</b> › Copiar ajustes, y en otra, ••• › Pegar ajustes. <b>Todo se puede deshacer</b> con Revertir.</p>
<div class="callout c-iphone"><span class="eyebrow">Regla de clase</span><p>Edita para acercarte a lo que viste o sentiste, no para arreglar una foto mal pensada. Si tienes que editar mucho, anota en tu cuaderno qué ajuste de la cámara lo habría evitado.</p></div>
<p class="muted">Los nombres de los ajustes pueden variar un poco según tu versión de iOS.</p>`,
   steps:[
    "Pasa al iPhone 20 fotos de los últimos días.",
    "Haz las tres pasadas y quédate con 5 favoritas.",
    "Edita una foto siguiendo el orden de los siete pasos.",
    "Compara el antes y el después tocando la foto mientras editas.",
    "Copia los ajustes de esa foto y pégalos en otra parecida."
   ],
   mission:"Elige 3 fotos y edítalas para que parezcan de la misma serie: parecido brillo, contraste y color. Ponlas juntas en un álbum y comprueba que se ven como un conjunto.",
  }
 ]},
 {id:5, week:"Semana 5", title:"Situaciones reales", lessons:[
  {id:"rafaga", title:"Ráfaga y temporizador", sub:"Modo de avance", min:20,
   evf:["Hi+","AF-C","⏱ 10 s","⏱ 2 s"],
   goal:"Capturar el instante justo en acción y salir tú también en las fotos.",
   body:`
<p>Pulsa el <b>lado izquierdo</b> de la rueda (modo de avance).</p>
<div class="table-wrap"><table>
<tr><th>Modo</th><th>Para qué</th></tr>
<tr><td>Disparo único</td><td>Una foto por pulsación. El normal.</td></tr>
<tr><td>Continuo Hi+</td><td>Hasta 11 fotos por segundo. La pantalla no muestra la escena en vivo entre fotos.</td></tr>
<tr><td>Continuo Hi / Mid / Lo</td><td>Algo más lento, pero ves la escena en vivo: más fácil seguir al sujeto.</td></tr>
<tr><td>Autodisparador 10 / 5 / 2 s</td><td>10 o 5 s para salir en la foto. 2 s para no mover la cámara al pulsar.</td></tr>
<tr><td>Autodisparador continuo</td><td>Tras la cuenta, hace varias fotos: perfecto para grupos (alguien siempre parpadea).</td></tr>
<tr><td>Horquillado</td><td>Varias fotos con distinto brillo, balance o DRO. Para escenas difíciles.</td></tr>
</table></div>
<p>Para acción, combina ráfaga con <b>AF-C</b>: la cámara reenfoca entre fotos. Usa Hi si quieres ver al sujeto mientras disparas.</p>
<p>Después de una ráfaga, la luz de acceso parpadea mientras guarda. Puedes seguir disparando.</p>
