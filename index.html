/* ---------- intent planner ---------- */
function mountPlanner(el){
  const Q = [
   ["subj","¿Qué fotografías?",[["persona","Una persona"],["grupo","Un grupo"],["paisaje","Paisaje o lugar"],["objeto","Objeto o comida"]]],
   ["move","¿Se mueve?",[["no","Está quieto"],["poco","Algo (camina, gesticula)"],["rapido","Rápido (corre, salta)"]]],
   ["want","¿Qué quieres conseguir?",[["blur","Fondo borroso"],["sharp","Todo nítido"],["freeze","Congelar el movimiento"],["trail","Mostrar el movimiento"]]],
   ["light","¿Cuánta luz hay?",[["sol","Sol"],["sombra","Sombra o nublado"],["interior","Interior"],["noche","Noche"]]]
  ];
  const st = {subj:"persona", move:"no", want:"blur", light:"sombra"};
  el.innerHTML = `<div class="card stack" style="gap:14px">${Q.map(([k,t,o]) => `<div><div class="eyebrow" style="margin-bottom:6px">${t}</div><div class="chips" data-q="${k}">${o.map(([v,n]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="false">${n}</button>`).join("")}</div></div>`).join("")}<div data-out aria-live="polite"></div></div>`;
  function plan(){
    const {subj, move, want, light} = st, dark = light === "interior" || light === "noche";
    const fast = {no:"1/125", poco:"1/250", rapido:"1/1000"}[move];
    const why = [], warn = [];
    let mode, N = "La elige la cámara", t = "La elige la cámara", iso = "AUTO", zoom = "El que encuadre mejor";
    if(want === "trail"){
      mode = "S"; iso = "100 (el más bajo)";
      if(move === "no"){ t = "1/8 a 1 segundo"; why.push("Una velocidad lenta convierte lo que se mueve en el encuadre (agua, gente, coches, nubes) en estelas; lo quieto queda nítido."); }
      else { t = "1/30, siguiendo al sujeto"; why.push("Barrido: si sigues al sujeto con la cámara mientras disparas, él queda nítido y el fondo sale en rayas."); }
      if(light === "sol") warn.push("Con sol puede sobrar luz y el número F parpadear. Busca sombra o espera a que baje el sol.");
    } else if(want === "freeze"){
      mode = "S"; t = move === "no" ? "1/250" : fast;
      why.push(`A ${t} el movimiento queda congelado. La cámara elige la apertura y el ISO sube si falta luz.`);
      if(move === "no") warn.push("Si nada se mueve no hace falta congelar. Quizá te interesa más elegir el fondo (modo A).");
    } else if(move === "rapido"){
      mode = "M con ISO AUTO"; t = fast;
      N = want === "blur" ? "La más baja (F5.6 a 50 mm)" : "F8";
      if(want === "blur") zoom = "50 mm";
      why.push("Mandan a la vez el movimiento y lo nítido: fijas tú la velocidad y la apertura, y la cámara ajusta el ISO.");
    } else {
      mode = "A";
      if(want === "blur"){ N = "La más baja (F5.6 a 50 mm)"; zoom = "50 mm"; why.push("Apertura abierta, zoom largo y poca distancia al sujeto: así el fondo se desenfoca al máximo con este objetivo. Aleja al sujeto del fondo."); }
      else { N = subj === "paisaje" ? "F8 a F11" : "F8"; zoom = subj === "paisaje" ? "16 mm" : (subj === "grupo" ? "16–24 mm" : zoom); why.push("Con F8 la zona nítida es amplia y el objetivo da su mejor detalle."); }
      if(move === "poco") warn.push("Vigila que la velocidad no baje de 1/250. Si baja, sube el ISO o pasa a M con ISO AUTO.");
    }
    if(want === "blur" && subj === "grupo") warn.push("Con fondo borroso, quien esté a otra distancia saldrá desenfocado. Ponlos en una línea o usa F8.");
    if(want === "blur" && subj === "paisaje") warn.push("En un paisaje casi todo está lejos: el fondo apenas se desenfocará. Busca algo cercano que destacar.");
    if(dark && iso === "AUTO") why.push("Hay poca luz: el ISO AUTO subirá hasta 6400. Mejor algo de grano que una foto movida.");
    if(light === "noche" && move === "no" && (subj === "paisaje" || subj === "objeto")){ iso = "100–400"; why.push("De noche, con un sujeto quieto, apoya la cámara: puedes usar velocidades lentas con ISO bajo y la máxima calidad."); }
    const focus = move === "no" ? "AF-S" : "AF-C";
    const area = subj === "persona" ? (move === "rapido" ? "Zona o Lock-on AF + Eye AF" : "Eye AF (botón central)") : subj === "grupo" ? "Punto flexible en una cara de la fila central" : subj === "paisaje" ? "Punto flexible a un tercio de la escena" : (move === "rapido" ? "Zona o Lock-on AF" : "Punto flexible pequeño en lo importante");
    const drive = move === "rapido" ? "Continuo Hi" : subj === "grupo" ? "Autodisparador continuo (3 fotos)" : (want === "trail" && move === "no") || (light === "noche" && move === "no") ? "Autodisparador 2 s, cámara apoyada" : "Disparo único";
    if(light === "sol" && (subj === "persona" || subj === "grupo")) warn.push("Sol directo en la cara: busca sombra abierta, o pon el sol detrás y usa flash de relleno.");
    if(light === "noche" && (subj === "persona" || subj === "grupo")) warn.push("Para iluminar caras de noche: flash con sincronización lenta, o acércalas a una fuente de luz.");
    if(light === "interior") why.push("Antes de subir el ISO, acerca el sujeto a una ventana o lámpara: la luz manda.");
    return {mode, N, t, iso, zoom, focus, area, drive, why, warn};
  }
  function render(){
    el.querySelectorAll("[data-q]").forEach(g => g.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === st[g.dataset.q])));
    const r = plan();
    el.querySelector("[data-out]").innerHTML = `<div class="stack" style="gap:10px">
      <h3>Tu punto de partida</h3>
      ${evfHTML([r.mode, r.t.startsWith("La") ? "VEL. AUTO" : r.t, r.N.startsWith("La e") ? "F AUTO" : r.N.replace(/ \(.*\)/,"").replace("La más baja","F MÍN."), "ISO " + r.iso])}
      <div class="recipe"><dl>
       <dt>Modo</dt><dd>${esc(r.mode)}</dd><dt>Apertura</dt><dd>${esc(r.N)}</dd><dt>Velocidad</dt><dd>${esc(r.t)}</dd><dt>ISO</dt><dd>${esc(r.iso)}</dd>
       <dt>Zoom</dt><dd>${esc(r.zoom)}</dd><dt>Enfoque</dt><dd>${r.focus} · ${esc(r.area)}</dd><dt>Avance</dt><dd>${esc(r.drive)}</dd>
      </dl></div>
      <div><b>Por qué</b><ul style="margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px">${r.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>
      ${r.warn.length ? `<div class="callout c-warn"><span class="eyebrow">Ojo</span>${r.warn.map(w => `<p>${esc(w)}</p>`).join("")}</div>` : ""}
    </div>`;
  }
  el.addEventListener("click", e => { const c = e.target.closest(".chip"); if(!c) return; st[c.closest("[data-q]").dataset.q] = c.dataset.v; render(); });
  render();
}

/* ---------- exposure simulator ---------- */
const AP = [3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22];
const SS = [1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,.3,.4,.5,.6,.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30];
const ISOS = [100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000,40000,51200];
const SCENES = [
 {id:"sol", n:"Sol", ev:15, sky:["#5FA8E0","#CFE8F7"], g:"#6E9F4E", hill:"#4F7F3E", tree:"#3E6B33", night:false},
 {id:"sombra", n:"Sombra", ev:12, sky:["#8DB2CF","#D7E3EA"], g:"#5E8549", hill:"#476B3B", tree:"#355A2D", night:false},
 {id:"atardecer", n:"Atardecer", ev:10, sky:["#E9875B","#F7D29A"], g:"#6B6A3E", hill:"#4D4B2E", tree:"#3A3923", night:false},
 {id:"interior", n:"Interior", ev:7, sky:["#D8C7A8","#E9DDC6"], g:"#9C7A55", hill:"#BCA683", tree:"#8E7556", night:false, indoor:true},
 {id:"noche", n:"Noche", ev:4, sky:["#0E1A33","#2A3B5E"], g:"#2E3A2C", hill:"#1D2638", tree:"#162016", night:true}
];
const SIM = {mode:"A", scene:"sombra", f:50, N:5.6, t:1/125, iso:400, isoAuto:true};
const nearestIdx = (arr, v) => { let bi = 0, bd = Infinity; arr.forEach((x,i) => { const d = Math.abs(Math.log2(x) - Math.log2(v)); if(d < bd){ bd = d; bi = i; } }); return bi; };
const snap = (arr, v) => arr[nearestIdx(arr, v)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function minAp(f){ const tbl = [[16,3.5],[18,4],[24,4.5],[30,5],[35,5.6],[50,5.6]]; for(let i=1;i<tbl.length;i++){ if(f <= tbl[i][0]){ const [f0,a0] = tbl[i-1], [f1,a1] = tbl[i]; const v = a0 + (a1-a0)*(f-f0)/(f1-f0); return AP.find(a => a >= v - 0.05) || 5.6; } } return 5.6; }
const fmtT = t => t >= .3 ? t + '"' : "1/" + Math.round(1/t);
const fmtN = N => "F" + N;

function solve(st){
  const sc = SCENES.find(s => s.id === st.scene), EV = sc.ev, mA = minAp(st.f);
  let N = Math.max(st.N, mA), t = st.t, iso = st.isoAuto ? 100 : st.iso;
  const blink = {};
  const L = i => EV + Math.log2(i / 100);
  const minSS = 1 / (st.f * 1.5);
  const isoFor = (N, t) => clamp(100 * Math.pow(2, Math.log2(N*N/t) - EV), 100, 6400);
  if(st.mode === "P" || st.mode === "A"){
    if(st.mode === "P"){ N = mA; let i = AP.indexOf(N); while(N*N/Math.pow(2, L(iso)) < 1/250 && N < 8){ N = AP[++i]; } }
    t = N*N / Math.pow(2, L(iso));
    if(st.isoAuto && t > minSS){ iso = snap(ISOS, isoFor(N, minSS)); t = N*N / Math.pow(2, L(iso)); }
    if(t < SS[0] || t > 30) blink.t = true;
    t = snap(SS, clamp(t, SS[0], 30));
  } else if(st.mode === "S"){
    let need = Math.sqrt(t * Math.pow(2, L(iso)));
    if(st.isoAuto && need < mA){ iso = snap(ISOS, isoFor(mA, t)); need = Math.sqrt(t * Math.pow(2, L(iso))); }
    if(need < mA - .05 || need > 22.5) blink.N = true;
    N = snap(AP, clamp(need, mA, 22));
  } else {
    if(st.isoAuto){ const raw = 100 * Math.pow(2, Math.log2(N*N/t) - EV); if(raw > 6400 || raw < 100) blink.iso = true; iso = snap(ISOS, clamp(raw, 100, 6400)); }
  }
  const delta = L(iso) - Math.log2(N*N/t);
  return {N, t, iso, delta, blink, sc, mA, minSS};
}

let noiseURL = null;
function getNoise(){
  if(noiseURL) return noiseURL;
  try{
    const c = document.createElement("canvas"); c.width = c.height = 160;
    const x = c.getContext("2d"), d = x.createImageData(160,160);
    for(let i=0;i<d.data.length;i+=4){ const v = Math.random()*255; d.data[i] = v + (Math.random()-.5)*60; d.data[i+1] = v; d.data[i+2] = v + (Math.random()-.5)*60; d.data[i+3] = 255; }
    x.putImageData(d,0,0); noiseURL = c.toDataURL();
  }catch(e){ noiseURL = ""; }
  return noiseURL;
}

function mountSim(el, opts){
  opts = opts || {};
  if(opts.mode){ SIM.mode = opts.mode; }
  el.innerHTML = `
  <div class="stack">
   <div class="sim-frame" data-frame>
    ${sceneSVG()}
    <div class="sim-noise" data-noise></div>
    <div class="sim-focus" aria-hidden="true"></div>
    <div class="sim-mode" data-osdmode></div>
    <div class="sim-osd" data-osd></div>
   </div>
   <div class="meter" data-meterwrap>
    <div style="display:flex;justify-content:space-between"><span>Más oscura</span><span data-metertxt></span><span>Más clara</span></div>
    <div class="meter-bar"><div class="meter-ticks">${[-3,-2,-1,0,1,2,3].map((v,i,a) => `<span class="big"><b>${v>0?"+"+v:v}</b></span>` + (i < a.length-1 ? "<span></span><span></span>" : "")).join("")}</div><div class="meter-mark" data-mark></div></div>
   </div>
   <div class="seg" role="group" aria-label="Modo">${["P","A","S","M"].map(m => `<button type="button" data-mode="${m}" aria-pressed="false">${m}</button>`).join("")}</div>
   <div class="chips" role="group" aria-label="Escena">${SCENES.map(s => `<button type="button" class="chip" data-scene="${s.id}" aria-pressed="false">${s.n}</button>`).join("")}</div>
   <div class="ctrls">
    <div class="ctrl"><label class="lab" for="sim-zoom">Zoom <small data-zoomtxt></small></label><output data-zoomv style="font:700 18px var(--f-mono)"></output><input type="range" id="sim-zoom" min="16" max="50" step="1" value="${SIM.f}"></div>
    <div class="ctrl" data-c="N"><div class="lab">Apertura <small data-sub></small></div><div class="stepper"><button type="button" data-d="-1" aria-label="Abrir (F más bajo)">−</button><output></output><button type="button" data-d="1" aria-label="Cerrar (F más alto)">+</button></div></div>
    <div class="ctrl" data-c="t"><div class="lab">Velocidad <small data-sub></small></div><div class="stepper"><button type="button" data-d="-1" aria-label="Más rápida">−</button><output></output><button type="button" data-d="1" aria-label="Más lenta">+</button></div></div>
    <div class="ctrl" data-c="iso"><div class="lab">ISO <small data-sub></small><button type="button" class="chip" data-isoauto style="margin-top:6px">ISO AUTO</button></div><div class="stepper"><button type="button" data-d="-1" aria-label="ISO más bajo">−</button><output></output><button type="button" data-d="1" aria-label="ISO más alto">+</button></div></div>
   </div>
   <ul class="verdict" data-verdict></ul>
   <p class="muted" style="font-size:14px">Simulación aproximada para entender la relación entre ajustes. Los valores de apertura mínima según el zoom son aproximados para el 16-50 mm.</p>
  </div>`;
  const $ = s => el.querySelector(s);
  $("[data-noise]").style.backgroundImage = getNoise() ? `url(${getNoise()})` : "none";

  function render(){
    const r = solve(SIM), sc = r.sc;
    // reflect camera-chosen values back into state so switching modes continues from them
    SIM.N = r.N; SIM.t = r.t; if(SIM.isoAuto) SIM._iso = r.iso;
    // scene colours
    $("[data-sky0]").setAttribute("stop-color", sc.sky[0]); $("[data-sky1]").setAttribute("stop-color", sc.sky[1]);
    $("[data-hill]").setAttribute("fill", sc.hill); $("[data-ground]").setAttribute("fill", sc.g);
    $("[data-trees]").setAttribute("fill", sc.tree);
    $("[data-sun]").setAttribute("fill", sc.night ? "#F4F1DE" : (sc.id === "atardecer" ? "#FFB04A" : "#FFF3B0"));
    $("[data-sun]").style.display = sc.indoor ? "none" : "";
    $("[data-stars]").style.display = sc.night ? "" : "none";
    $("[data-lamps]").style.display = sc.night ? "" : "none";
    el.querySelectorAll("[data-win]").forEach(w => w.setAttribute("fill", sc.night ? "#FFCF6E" : "#7E97A8"));
    $("[data-house]").style.display = sc.indoor ? "none" : "";
    // zoom
    const z = 1 + (SIM.f - 16) / 34 * 0.6;
    $("[data-world]").setAttribute("transform", `translate(132 118) scale(${z.toFixed(3)}) translate(-132 -118)`);
    // depth of field
    const bg = 0.15 + 3.4 * Math.pow(SIM.f / 50, 1.6) * (3.5 / r.N);
    $("[data-bgblur]").setAttribute("stdDeviation", bg.toFixed(2));
    // motion of the cyclist
    const mv = Math.min(30, 420 * r.t);
    $("[data-movblur]").setAttribute("stdDeviation", `${mv.toFixed(2)} 0`);
    // camera shake (with SteadyShot about 2 stops of help)
    const shakeRatio = r.t / r.minSS;
    $("[data-shake]").setAttribute("stdDeviation", shakeRatio > 4 ? Math.min(2.2, .4 * Math.log2(shakeRatio)).toFixed(2) : 0);
    // brightness & noise
    const b = clamp(Math.pow(2, r.delta * .75), .05, 4.5);
    $("[data-frame] svg").style.filter = `brightness(${b.toFixed(3)})` + (r.delta > 1.2 ? ` contrast(${clamp(1 - (r.delta-1.2)*.15, .6, 1).toFixed(2)})` : "");
    const nz = clamp((Math.log2(r.iso / 100) - 3.3) / 6.5, 0, 1);
    $("[data-noise]").style.opacity = (nz * .5).toFixed(2);
    // OSD
    const bl = (k, s) => r.blink[k] ? `<span class="blink">${s}</span>` : `<span>${s}</span>`;
    $("[data-osdmode]").textContent = SIM.mode;
    const ev = (r.delta >= 0 ? "+" : "−") + Math.abs(Math.round(r.delta * 3) / 3).toFixed(1);
    $("[data-osd]").innerHTML = bl("t", fmtT(r.t)) + bl("N", fmtN(r.N)) + (SIM.mode === "M" && !SIM.isoAuto ? `<span>MM ${ev}</span>` : `<span>±0.0</span>`) + bl("iso", "ISO " + (SIM.isoAuto ? "AUTO " : "") + r.iso);
    // meter
    const mpos = clamp(r.delta, -3.3, 3.3);
    $("[data-mark]").style.left = `${((mpos + 3) / 6 * 100).toFixed(1)}%`;
    $("[data-metertxt]").textContent = Math.abs(r.delta) < .2 ? "Exposición correcta" : (r.delta > 0 ? `+${r.delta.toFixed(1)} pasos` : `${r.delta.toFixed(1)} pasos`);
    // controls
    el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === SIM.mode));
    el.querySelectorAll("[data-scene]").forEach(x => x.setAttribute("aria-pressed", x.dataset.scene === SIM.scene));
    $("[data-zoomv]").textContent = SIM.f + " mm";
    $("[data-zoomtxt]").textContent = `F más bajo posible: F${r.mA}`;
    const user = {N: SIM.mode === "A" || SIM.mode === "M", t: SIM.mode === "S" || SIM.mode === "M", iso: !SIM.isoAuto};
    const val = {N: fmtN(r.N), t: fmtT(r.t), iso: (SIM.isoAuto ? "AUTO " : "") + r.iso};
    const sub = {N: user.N ? "Tú la eliges" : "La elige la cámara", t: user.t ? "Tú la eliges" : "La elige la cámara", iso: SIM.isoAuto ? "La cámara la ajusta (100–6400)" : "Tú lo eliges"};
    ["N","t","iso"].forEach(k => {
      const c = el.querySelector(`[data-c="${k}"]`);
      c.classList.toggle("auto", !user[k]);
      c.querySelector("output").textContent = val[k];
      c.querySelector("[data-sub]").textContent = sub[k];
      c.querySelectorAll("[data-d]").forEach(x => x.disabled = !user[k]);
    });
    $("[data-isoauto]").setAttribute("aria-pressed", SIM.isoAuto);
    // verdict
    const v = [];
    const expTxt = Math.abs(r.delta) < .4 ? "Correcta." : r.delta > 0 ? (r.delta > 1.5 ? "Muy clara: zonas quemadas." : "Algo clara.") : (r.delta < -1.5 ? "Muy oscura." : "Algo oscura.");
    v.push(["Brillo", expTxt, Math.abs(r.delta) >= .4]);
    v.push(["Fondo", bg * z > 4.5 ? "Muy desenfocado." : bg * z > 2 ? "Desenfocado." : bg * z > 1 ? "Algo suave." : "Nítido.", false]);
    v.push(["Ciclista", mv < 1.2 ? "Congelado." : mv < 5 ? "Ligeramente movido." : "Estela de movimiento.", false]);
    v.push(["Ruido", r.iso <= 800 ? "Imperceptible." : r.iso <= 3200 ? "Muy bajo." : r.iso <= 6400 ? "Algo de grano." : "Mucho grano.", r.iso > 6400]);
    v.push(["Pulso", shakeRatio <= 1 ? "Sin riesgo de foto movida." : shakeRatio <= 4 ? "El SteadyShot te salva; sujétala firme." : "Foto movida: apoya la cámara o usa trípode.", shakeRatio > 4]);
    const bk = Object.keys(r.blink);
    if(bk.length) v.push(["Aviso", "Un valor parpadea: la cámara no llega a la exposición correcta con estos ajustes.", true]);
    $("[data-verdict]").innerHTML = v.map(([a,b,w]) => `<li class="${w?"w":""}"><b>${a}</b>${b}</li>`).join("");
  }
  el.addEventListener("click", e => {
    const m = e.target.closest("[data-mode]"); if(m){ SIM.mode = m.dataset.mode; if(SIM.mode === "M" && SIM.isoAuto && SIM._iso){ /* keep auto */ } render(); return; }
    const s = e.target.closest("[data-scene]"); if(s){ SIM.scene = s.dataset.scene; render(); return; }
    if(e.target.closest("[data-isoauto]")){ if(SIM.isoAuto){ SIM.iso = SIM._iso || 400; } SIM.isoAuto = !SIM.isoAuto; render(); return; }
    const d = e.target.closest("[data-d]"); if(d){
      const k = d.closest("[data-c]").dataset.c, dir = +d.dataset.d;
      if(k === "N"){ const i = clamp(AP.indexOf(snap(AP, SIM.N)) + dir, 0, AP.length - 1); SIM.N = Math.max(AP[i], minAp(SIM.f)); }
      if(k === "t"){ const i = clamp(nearestIdx(SS, SIM.t) + dir, 0, SS.length - 1); SIM.t = SS[i]; }
      if(k === "iso"){ const i = clamp(nearestIdx(ISOS, SIM.iso) + dir, 0, ISOS.length - 1); SIM.iso = ISOS[i]; }
      render();
    }
  });
  $("#sim-zoom").addEventListener("input", e => { SIM.f = +e.target.value; render(); });
  render();
}

/* ---------- practice mode: one step per screen, screen kept awake ---------- */
let wake = null;
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    if(!on && wake){ await wake.release(); wake = null; }
  }catch(e){ wake = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && document.querySelector(".practice")) keepAwake(true); });
function openPractice(l, onChange){
  const n = l.steps.length;
  let k = Math.max(0, l.steps.findIndex((_, i) => !(S.steps[l.id] || []).includes(i)));
  const ov = document.createElement("div");
  ov.className = "practice"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Modo práctica");
  document.body.appendChild(ov); document.body.style.overflow = "hidden";
  keepAwake(true);
  const mark = i => { const set = new Set(S.steps[l.id] || []); set.add(i); S.steps[l.id] = [...set]; save(); onChange(); };
  function close(){ keepAwake(false); ov.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); }
  function draw(){
    const end = k >= n;
    ov.innerHTML = `
     <div class="pr-top"><span class="eyebrow">${esc(l.title)}</span><button type="button" class="pr-x" data-x aria-label="Cerrar modo práctica">✕</button></div>
     <div class="progress" aria-hidden="true"><i style="width:${(Math.min(k,n)/n*100).toFixed(1)}%"></i></div>
     <div class="pr-body">
      ${end ? `<span class="eyebrow">¡Pasos completados!</span><p class="pr-step">Ahora, tu misión:</p><p class="pr-mission">${fmt(l.mission)}</p>`
            : `<span class="eyebrow">Paso ${k+1} de ${n}</span><p class="pr-step">${fmt(l.steps[k])}</p>`}
     </div>
     <div class="pr-nav">
      ${end ? `<button type="button" class="btn btn-ghost" data-prev>Anterior</button><button type="button" class="btn btn-primary" data-x>Volver a la lección</button>`
            : `<button type="button" class="btn btn-ghost" data-prev ${k===0?"disabled":""}>Anterior</button><button type="button" class="btn btn-ok" data-next>${k===n-1?"Hecho, terminar":"Hecho, siguiente"}</button>`}
     </div>
     <p class="pr-hint">${wake ? "La pantalla se mantendrá encendida mientras practicas." : "Consejo: deja el móvil apoyado a la vista mientras usas la cámara."}</p>`;
    ov.querySelector("[data-next],[data-x]:not(.pr-x)")?.focus();
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  ov.addEventListener("click", e => {
    if(e.target.closest("[data-x]")) return close();
    if(e.target.closest("[data-prev]")){ k = Math.max(0, k-1); draw(); }
    if(e.target.closest("[data-next]")){ mark(k); k++; draw(); }
  });
  draw(); setTimeout(draw, 400);
}

    <button type="button" class="btn btn-primary practice-btn" data-practice><span aria-hidden="true">▶</span> Modo práctica: un paso a la vez</button>
    <p class="muted" style="font-size:14px;margin-top:-4px">Pantalla grande, botones abajo para el pulgar y la pantalla no se apaga mientras practicas. También puedes marcar los pasos aquí abajo.</p>
    <ol class="steps">${l.steps.map((s, k) => `<li><input type="checkbox" id="st-${l.id}-${k}" data-k="${k}" ${st.has(k)?"checked":""}><label for="st-${l.id}-${k}"><span class="box" aria-hidden="true"></span><span>${fmt(s)}</span></label></li>`).join("")}</ol>
   </section>
   <section class="mission" id="sec-mision">
    <span class="eyebrow">Misión de práctica</span>
    <p>${fmt(l.mission)}</p>
   </section>
   <section class="stack" style="gap:8px">
    <label for="nota-${l.id}" id="sec-cuaderno"><h2>Tu cuaderno</h2></label>
    <p class="muted" style="font-size:15px">Apunta qué querías capturar, qué ajustes elegiste y por qué, y qué cambiarías. Releerlo te enseña tanto como las lecciones.</p>
    <textarea id="nota-${l.id}" class="notes" rows="5" placeholder="Quería: …&#10;Ajustes: A · F5.6 · 1/250 · ISO 400, porque…&#10;Resultado: …&#10;La próxima vez: …">${esc(S.notes[l.id] || "")}</textarea>
    <span class="muted" style="font-size:13px" data-saved></span>
   </section>
   <div class="lesson-foot" data-foot></div>
  </article>`;
  function foot(){
    const done = !!S.done[l.id];
    app.querySelector("[data-foot]").innerHTML = `
     ${done ? `<div class="donebar">✓ Lección completada</div>` : ""}
     <div class="btn-row">
      ${done ? (next ? `<a class="btn btn-primary" href="#leccion-${next.id}">Siguiente: ${esc(next.title)}</a>` : `<a class="btn btn-primary" href="#programa">Volver al programa</a>`)
             : `<button type="button" class="btn btn-ok" data-complete>Marcar como completada</button>`}
      ${done ? `<button type="button" class="linkbtn" data-undo>Desmarcar</button>` : ""}
     </div>
     <div class="btn-row" style="justify-content:space-between">
      ${prev ? `<a href="#leccion-${prev.id}" class="muted" style="font-size:15px">‹ ${esc(prev.title)}</a>` : "<span></span>"}
      ${!done && next ? `<a href="#leccion-${next.id}" class="muted" style="font-size:15px">Saltar a la siguiente ›</a>` : ""}
     </div>`;
  }
  foot();
  app.onchange = onStep;
  let tmr; const ta = app.querySelector(".notes");
  ta.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { const v = ta.value.trim(); if(v) S.notes[l.id] = ta.value; else delete S.notes[l.id]; save(); app.querySelector("[data-saved]").textContent = "Guardado en este dispositivo."; }, 400); });
  function onStep(e){
    const c = e.target.closest(".steps input"); if(!c) return;
    const set = new Set(S.steps[l.id] || []); c.checked ? set.add(+c.dataset.k) : set.delete(+c.dataset.k);
    S.steps[l.id] = [...set]; save();
  }
  app.onclick = e => {
    const j = e.target.closest("[data-jump]"); if(j){ document.getElementById(j.dataset.jump)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
    if(e.target.closest("[data-practice]")){ openPractice(l, () => { const done = new Set(S.steps[l.id] || []); app.querySelectorAll(".steps input").forEach(c => c.checked = done.has(+c.dataset.k)); }); return; }
    if(e.target.closest("[data-complete]")){ S.done[l.id] = true; save(); updateRing(); foot(); app.querySelector("[data-foot]").scrollIntoView({block:"nearest", behavior:"smooth"}); }
    else if(e.target.closest("[data-undo]")){ delete S.done[l.id]; save(); updateRing(); foot(); }
    const o = e.target.closest("[data-opensim]"); if(o){ SIM.mode = o.dataset.opensim; if(l.id === "iso") SIM.scene = "interior"; location.hash = "simulador"; }
  };
  app.querySelectorAll("[data-widget=camera]").forEach(mountCamera);
  app.querySelectorAll("[data-widget=wb]").forEach(mountWB);
  app.querySelectorAll("[data-widget=planner]").forEach(mountPlanner);
}

function viewCamera(){
  app.innerHTML = `<div class="stack-l"><div class="stack"><span class="eyebrow">Mapa de la cámara</span><h1>Cada botón, explicado</h1><p class="muted">Toca una parte del esquema o elige su nombre abajo.</p></div><div data-cam></div></div>`;
  mountCamera(app.querySelector("[data-cam]"));
}
function viewSim(){
  app.innerHTML = `<div class="stack-l"><div class="stack"><span class="eyebrow">Simulador de exposición</span><h1>Juega con la luz</h1><p class="muted">Elige un modo y una escena. Lo que eliges tú se ajusta con − y +; lo demás lo decide la cámara, igual que en tu α6500.</p></div><div data-sim></div></div>`;
  mountSim(app.querySelector("[data-sim]"));
}
function viewRecipes(){
  app.innerHTML = `<div class="stack-l">
   <div class="stack"><span class="eyebrow">Chuleta</span><h1>Recetas para salir a fotografiar</h1><p class="muted">Empieza por lo que quieres capturar. El planificador te propone ajustes y te explica por qué; las recetas de abajo cubren situaciones típicas.</p></div>
   <section class="stack" style="gap:10px"><h2>Planificador: ¿qué quieres capturar?</h2><div data-planner></div></section>
   <section class="card stack" style="gap:10px;border-color:var(--accent)"><h2 style="font-size:21px">Rutina antes de salir</h2><p class="muted" style="font-size:15px">Lo que cualquier fotógrafo revisa antes de una sesión. Un minuto que evita perder fotos.</p>
    <ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">
     <li>Batería cargada (y la de repuesto, si tienes).</li>
     <li>Tarjeta puesta y con espacio. Pasa y borra las fotos de la última salida.</li>
     <li>Lente frontal limpia, sin huellas.</li>
     <li>Compensación de exposición en <b>±0.0</b>: se queda puesta de la última vez.</li>
     <li>ISO en <b>AUTO</b>, no en un valor que dejaste fijo de noche.</li>
     <li>Balance de blancos en <b>Auto</b>, salvo que lo hayas elegido a propósito.</li>
     <li>Modo de avance en <b>Disparo único</b> (o ráfaga si vas a por acción).</li>
     <li>Calidad correcta: JPEG Extra fino o RAW y JPEG.</li>
    </ol></section>
   ${RECIPES.map(r => `<section class="card recipe"><h2 style="font-size:21px">${esc(r.t)}</h2>${evfHTML(r.evf)}<dl>${r.d.map(([a,b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl><p class="muted" style="font-size:15px"><b>Consejo:</b> ${esc(r.tip)}</p><a href="#leccion-${r.l}" style="font-size:15px;font-weight:700">Repasar la lección: ${esc(byId(r.l).title)} ›</a></section>`).join("")}
   <section class="stack" style="gap:10px" id="glosario"><h2>Glosario</h2><label for="gloss-q" class="muted" style="font-size:15px">Busca una palabra que no recuerdes.</label><input id="gloss-q" type="search" class="notes" style="padding:10px 14px" placeholder="Por ejemplo: apertura, ISO, RAW" autocomplete="off"><dl class="gloss" data-gloss></dl></section>
  </div>`;
  mountPlanner(app.querySelector("[data-planner]"));
  const box = app.querySelector("[data-gloss]"), q = app.querySelector("#gloss-q");
  const draw = () => { const t = q.value.trim().toLowerCase(); const items = GLOSS.filter(([a,b]) => !t || (a+" "+b).toLowerCase().includes(t)); box.innerHTML = items.length ? items.map(([a,b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("") : `<p class="muted">No hay ningún término con «${esc(q.value)}».</p>`; };
  q.addEventListener("input", draw); draw();
}

function route(){
  const h = (location.hash || "#programa").slice(1);
  app.onclick = null; app.onchange = null;
  let tab = "programa";
  if(h.startsWith("leccion-") && byId(h.slice(8))) viewLesson(byId(h.slice(8)));
  else if(h === "camara"){ tab = "camara"; viewCamera(); }
  else if(h === "simulador"){ tab = "simulador"; viewSim(); }
  else if(h === "recetas"){ tab = "recetas"; viewRecipes(); }
  else viewHome();
  document.querySelectorAll(".nav a").forEach(a => { if(a.dataset.tab === tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
  updateRing();
}
window.addEventListener("hashchange", route);
route();
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
